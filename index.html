<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#0b0b0f">
<title>لوحة التحكم — Link2Go</title>
<link rel="icon" type="image/png" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#07070a;--text:#fff;--muted:#9b9ba5;--border:rgba(255,255,255,.09);
  --accent:#ff1744;--accent2:#ff4d6d;--success:#20d77a;--gold:#ffcc00;--purple:#6c5ce7;
}
body{
  font-family:'Cairo',system-ui,-apple-system,sans-serif;
  background:radial-gradient(circle at 50% -10%,rgba(255,23,68,.15),transparent 45%),var(--bg);
  color:var(--text);min-height:100vh;overflow-x:hidden;
}
.bg{position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden;}
.bg::before,.bg::after{content:'';position:absolute;width:420px;height:420px;border-radius:50%;filter:blur(120px);opacity:.15;}
.bg::before{background:#ff1744;top:-180px;right:-120px;}
.bg::after{background:#6c5ce7;bottom:-200px;left:-120px;}

/* ============ Login ============ */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
#loginScreen.hidden{display:none;}

.login-card{
  width:100%;max-width:420px;
  background:linear-gradient(145deg,rgba(28,28,38,.98),rgba(18,18,26,.98));
  border:1px solid rgba(255,255,255,.1);
  border-radius:24px;padding:40px 30px;
  text-align:center;position:relative;overflow:hidden;
  box-shadow:0 30px 90px rgba(0,0,0,.8);
}
.login-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,#ff1744,#ffcc00,#ff1744);
  background-size:200% 100%;animation:shine 3s linear infinite;
}
@keyframes shine{to{background-position:200% center;}}

.login-icon{
  width:80px;height:80px;border-radius:50%;margin:0 auto 20px;
  display:grid;place-items:center;
  background:linear-gradient(135deg,#ff1744,#ff4d6d);
  box-shadow:0 0 50px rgba(255,23,68,.5);
}
.login-icon svg{width:36px;height:36px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
.login-card h1{
  font-size:24px;font-weight:900;margin-bottom:8px;
  background:linear-gradient(135deg,#fff,#ff8a9f);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.login-card p{color:var(--muted);font-size:13.5px;margin-bottom:28px;}

.login-field{margin-bottom:16px;text-align:right;}
.login-field label{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:6px;}
.login-field input{
  width:100%;padding:14px 16px;border-radius:12px;
  border:1px solid var(--border);background:rgba(0,0,0,.3);color:#fff;
  font-family:inherit;font-size:14px;transition:.25s;
}
.login-field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,23,68,.15);}

.login-btn{
  width:100%;padding:15px;border-radius:13px;border:0;margin-top:10px;
  font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;transition:all .25s;
  background:linear-gradient(135deg,#20d77a,#06d6a0);color:#fff;
  box-shadow:0 12px 35px rgba(32,215,122,.35);
}
.login-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 17px 45px rgba(32,215,122,.5);}
.login-btn:disabled{opacity:.6;cursor:wait;}

.login-msg{display:none;padding:12px 16px;border-radius:12px;font-size:13px;margin-bottom:16px;}
.login-msg.show{display:block;}
.login-msg.err{background:rgba(255,71,87,.1);color:#ff9ca5;border:1px solid rgba(255,71,87,.25);}

/* ============ Main ============ */
#mainPanel{display:none;}
#mainPanel.show{display:block;}

.wrap{width:min(1100px,94%);margin:0 auto;padding:30px 0 80px;}

header{
  display:flex;justify-content:space-between;align-items:center;
  padding:20px 0 30px;flex-wrap:wrap;gap:14px;
}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;}
.brand-icon{
  width:46px;height:46px;border-radius:14px;display:grid;place-items:center;
  background:linear-gradient(145deg,#ff1744,#ff4568);
  box-shadow:0 10px 30px rgba(255,23,68,.28);overflow:hidden;
}
.brand-icon img{width:100%;height:100%;object-fit:cover;}
.brand-text strong{display:block;font-size:18px;font-weight:900;}
.brand-text span{display:block;color:var(--muted);font-size:11px;margin-top:2px;}

.h-btns{display:flex;gap:10px;flex-wrap:wrap;}
.h-btn{
  display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;
  border:1px solid var(--border);background:rgba(255,255,255,.05);color:#ddd;
  font-family:inherit;font-size:13px;font-weight:700;text-decoration:none;cursor:pointer;
  transition:.25s;
}
.h-btn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,23,68,.5);color:#fff;}
.h-btn.danger:hover{background:rgba(255,71,87,.15);border-color:rgba(255,71,87,.5);color:#ff9ca5;}
.h-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}

.admin-card{
  background:linear-gradient(145deg,rgba(28,28,38,.95),rgba(18,18,26,.98));
  border:1px solid var(--border);border-radius:20px;
  padding:20px;margin-bottom:24px;
}
.admin-row{display:flex;gap:10px;flex-wrap:wrap;}
.admin-row input{
  flex:1;min-width:200px;padding:12px 14px;border-radius:12px;
  border:1px solid var(--border);background:rgba(0,0,0,.3);color:#fff;
  font-family:inherit;font-size:13.5px;
}
.admin-row input:focus{outline:none;border-color:var(--accent);}
.admin-row button{
  padding:12px 22px;border-radius:12px;border:0;
  background:linear-gradient(135deg,#ff1744,#ff4d6d);color:#fff;
  font-family:inherit;font-size:13.5px;font-weight:800;cursor:pointer;
  transition:.25s;box-shadow:0 10px 30px rgba(255,23,68,.3);
}
.admin-row button:hover{transform:translateY(-2px);box-shadow:0 15px 40px rgba(255,23,68,.5);}
.admin-row button:disabled{opacity:.6;cursor:wait;transform:none;}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
.tab{
  padding:10px 18px;border-radius:12px;border:1px solid var(--border);
  background:rgba(255,255,255,.04);color:#aaa;
  font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;
  transition:.25s;
}
.tab:hover{background:rgba(255,255,255,.08);color:#fff;}
.tab.active{
  background:linear-gradient(135deg,#ff1744,#ff4d6d);color:#fff;
  border-color:transparent;box-shadow:0 8px 25px rgba(255,23,68,.35);
}
.tab svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px;margin-left:4px;}

.panel{display:none;}
.panel.active{display:block;animation:fade .3s ease;}
@keyframes fade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

.msg{display:none;padding:12px 16px;border-radius:12px;font-size:13px;margin-bottom:16px;}
.msg.show{display:block;}
.msg.ok{background:rgba(32,215,122,.1);color:#88e9b3;border:1px solid rgba(32,215,122,.25);}
.msg.err{background:rgba(255,71,87,.1);color:#ff9ca5;border:1px solid rgba(255,71,87,.25);}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px;}
.stat{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:14px;padding:18px;}
.stat-label{font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:6px;}
.stat-value{font-size:24px;font-weight:900;color:#fff;}
.stat.blue .stat-value{color:#9fc4ff;}
.stat.green .stat-value{color:#88e9b3;}
.stat.gold .stat-value{color:var(--gold);}

.list{display:flex;flex-direction:column;gap:10px;}

.card{
  background:rgba(20,20,26,.8);border:1px solid var(--border);
  border-radius:14px;padding:16px;transition:.25s;
}
.card:hover{border-color:rgba(255,23,68,.4);background:rgba(28,28,38,.9);}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
.card-title{font-size:15px;font-weight:800;margin-bottom:2px;}
.card-phone{font-size:12.5px;color:#9fc4ff;margin-bottom:8px;direction:ltr;text-align:right;font-weight:600;}
.card-actions{display:flex;gap:8px;flex-wrap:wrap;}

.badge{
  display:inline-block;padding:3px 10px;border-radius:100px;
  font-size:11px;font-weight:800;letter-spacing:.2px;
}
.badge.free{background:rgba(255,255,255,.1);color:#ccc;}
.badge.weekly{background:rgba(108,92,231,.2);color:#a29bfe;}
.badge.monthly{background:linear-gradient(135deg,#ffcc00,#ffaa00);color:#000;}
.badge.cancelled{background:rgba(255,71,87,.15);color:#ff9ca5;}
.badge.pending{background:rgba(255,204,0,.15);color:#ffcc00;}
.badge.large{background:linear-gradient(135deg,#ff1744,#ff4d6d);color:#fff;font-size:10px;}
.badge.audio{background:rgba(108,92,231,.2);color:#a29bfe;}
.badge.video{background:rgba(255,85,0,.15);color:#ff8a5c;}

.meta-row{
  display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;
  font-size:11.5px;color:var(--muted);
}
.meta-row span{display:inline-flex;align-items:center;gap:4px;}
.meta-row svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.4;}

.card-btn{
  padding:8px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.05);color:#ddd;
  font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;
  transition:.2s;text-decoration:none;display:inline-flex;align-items:center;gap:6px;
}
.card-btn:hover{background:rgba(255,255,255,.1);color:#fff;}
.card-btn.primary{background:linear-gradient(135deg,#20d77a,#06d6a0);color:#fff;border:0;}
.card-btn.primary:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(32,215,122,.35);}
.card-btn.danger{background:rgba(255,71,87,.15);color:#ff9ca5;border:1px solid rgba(255,71,87,.25);}
.card-btn.danger:hover{background:rgba(255,71,87,.3);color:#fff;}
.card-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}

.loading{text-align:center;padding:40px;color:var(--muted);font-size:13px;}
.spinner{
  width:40px;height:40px;border-radius:50%;margin:0 auto 14px;
  border:3px solid rgba(255,23,68,.2);border-top-color:#ff1744;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.empty{text-align:center;padding:50px 20px;color:var(--muted);font-size:14px;}

.refresh-indicator{
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:10px;font-size:11.5px;color:var(--muted);margin-top:16px;
}
.dot{width:8px;height:8px;border-radius:50%;background:#20d77a;animation:pulseDot 1.5s ease-in-out infinite;}
@keyframes pulseDot{0%,100%{opacity:1;}50%{opacity:.3;}}

/* Modal */
.modal{
  display:none;position:fixed;inset:0;z-index:2000;
  background:rgba(5,5,8,.85);backdrop-filter:blur(15px);
  align-items:center;justify-content:center;padding:20px;
}
.modal.active{display:flex;}
.modal-card{
  width:100%;max-width:520px;background:linear-gradient(145deg,rgba(28,28,38,.98),rgba(18,18,26,.98));
  border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:30px;
  position:relative;overflow:hidden;
  box-shadow:0 30px 90px rgba(0,0,0,.8);
  max-height:90vh;overflow-y:auto;
}
.modal-card h3{font-size:18px;font-weight:800;margin-bottom:6px;color:#fff;}
.modal-card .modal-subtitle{
  font-size:12.5px;color:#9fc4ff;direction:ltr;text-align:right;
  font-weight:600;margin-bottom:16px;
}
.modal-card .modal-meta{
  display:flex;gap:14px;flex-wrap:wrap;
  font-size:11.5px;color:var(--muted);
  padding-bottom:16px;margin-bottom:8px;
  border-bottom:1px dashed rgba(255,255,255,.1);
}
.modal-card label{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin:14px 0 6px;}
.modal-card input,.modal-card select{
  width:100%;padding:12px 14px;border-radius:12px;
  border:1px solid var(--border);background:rgba(0,0,0,.3);color:#fff;
  font-family:inherit;font-size:13.5px;
}
.modal-card input:focus,.modal-card select:focus{outline:none;border-color:var(--accent);}
.modal-actions{display:flex;flex-direction:column;gap:8px;margin-top:20px;}
.modal-btn{
  padding:13px;border-radius:12px;border:0;
  font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;
  transition:.25s;
}
.modal-btn.primary{background:linear-gradient(135deg,#20d77a,#06d6a0);color:#fff;box-shadow:0 10px 30px rgba(32,215,122,.35);}
.modal-btn.primary:hover{transform:translateY(-2px);box-shadow:0 15px 40px rgba(32,215,122,.5);}
.modal-btn.secondary{background:rgba(255,255,255,.05);color:#9b9ba5;border:1px solid rgba(255,255,255,.12);}
.modal-btn.secondary:hover{background:rgba(255,255,255,.1);color:#fff;}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

/* Video Modal */
.video-modal{
  display:none;position:fixed;inset:0;z-index:2500;
  background:rgba(5,5,8,.95);backdrop-filter:blur(20px);
  align-items:center;justify-content:center;padding:20px;
}
.video-modal.active{display:flex;}
.video-modal-card{
  width:100%;max-width:900px;background:rgba(20,20,26,.98);
  border:1px solid var(--border);border-radius:20px;
  padding:20px;position:relative;
  box-shadow:0 30px 90px rgba(0,0,0,.9);
}
.video-modal-card video{
  width:100%;border-radius:14px;background:#000;
  max-height:70vh;display:block;
}
.video-modal-card audio{
  width:100%;margin-top:10px;
}
.video-modal-head{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:16px;gap:12px;flex-wrap:wrap;
}
.video-modal-title{
  font-size:15px;font-weight:800;word-break:break-all;flex:1;min-width:0;
}
.video-modal-info{
  display:flex;gap:14px;flex-wrap:wrap;
  font-size:12px;color:var(--muted);margin-top:14px;
  padding-top:14px;border-top:1px dashed rgba(255,255,255,.1);
}
.close-x{
  width:38px;height:38px;border-radius:10px;border:0;
  background:rgba(255,71,87,.15);color:#ff9ca5;
  cursor:pointer;display:grid;place-items:center;
  transition:.25s;flex-shrink:0;
}
.close-x:hover{background:rgba(255,71,87,.3);color:#fff;}
.close-x svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;}

@media(max-width:600px){
  .wrap{padding:20px 0 60px;}
  .brand-text strong{font-size:16px;}
  header{padding:16px 0 24px;}
  .admin-card{padding:14px;}
  .card{padding:14px;}
  .card-head{flex-direction:column;}
  .stat-value{font-size:20px;}
  .modal-card{padding:22px;}
  .tabs{gap:6px;}
  .tab{padding:8px 14px;font-size:12px;}
  .grid-2{grid-template-columns:1fr;}
  .login-card{padding:30px 22px;}
  .video-modal-card{padding:14px;}
}
</style>
</head>
<body>

<div class="bg"></div>

<!-- ============ Login ============ -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-icon">
      <svg viewBox="0 0 24 24">
        <rect x="3" y="11" width="18" height="11" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>
    <h1>لوحة التحكم</h1>
    <p>سجّل دخولك للوصول إلى لوحة الأدمن</p>

    <div class="login-msg" id="loginMsg"></div>

    <div class="login-field">
      <label>اسم المستخدم</label>
      <input id="usernameInput" type="text" placeholder="Username" autocomplete="username">
    </div>

    <div class="login-field">
      <label>كلمة المرور</label>
      <input id="passwordInput" type="password" placeholder="Password" autocomplete="current-password">
    </div>

    <button class="login-btn" id="loginBtn">تسجيل الدخول</button>
  </div>
</div>

<!-- ============ Main ============ -->
<div id="mainPanel">
  <div class="wrap">

    <header>
      <a href="index.html" class="brand">
        <div class="brand-icon">
          <img src="logo.png" alt="Link2Go" onerror="this.parentElement.innerHTML='<svg viewBox=\'0 0 24 24\' style=\'width:24px;height:24px;fill:#fff\'><path d=\'M8 5v14l11-7z\'/></svg>'">
        </div>
        <div class="brand-text">
          <strong>لوحة التحكم</strong>
          <span id="welcomeText">مرحباً</span>
        </div>
      </a>
      <div class="h-btns">
        <a href="index.html" class="h-btn">
          <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          الرئيسية
        </a>
        <a href="plans.html" class="h-btn">
          <svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/></svg>
          الباقات
        </a>
        <button class="h-btn danger" id="logoutBtn">
          <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          خروج
        </button>
      </div>
    </header>

    <div class="msg" id="msg"></div>

    <div class="tabs">
      <button class="tab active" data-tab="users">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        المستخدمون
      </button>
      <button class="tab" data-tab="files">
        <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        الملفات
      </button>
      <button class="tab" data-tab="plans">
        <svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/></svg>
        الباقات
      </button>
    </div>

    <!-- ====== المستخدمون ====== -->
    <div class="panel active" id="panel-users">
      <div class="stats">
        <div class="stat green">
          <div class="stat-label">إجمالي المستخدمين</div>
          <div class="stat-value" id="statTotal">—</div>
        </div>
        <div class="stat blue">
          <div class="stat-label">باقة مجانية</div>
          <div class="stat-value" id="statFree">—</div>
        </div>
        <div class="stat blue">
          <div class="stat-label">باقة أسبوعية</div>
          <div class="stat-value" id="statWeekly">—</div>
        </div>
        <div class="stat gold">
          <div class="stat-label">باقة شهرية VIP</div>
          <div class="stat-value" id="statMonthly">—</div>
        </div>
      </div>

      <div class="admin-card">
        <div class="admin-row">
          <input id="userSearch" type="text" placeholder="ابحث بالاسم أو رقم التليفون...">
          <button id="refreshUsersBtn">تحديث</button>
        </div>
      </div>

      <div id="usersList" class="list">
        <div class="loading"><div class="spinner"></div>جاري التحميل...</div>
      </div>

      <div class="refresh-indicator">
        <span class="dot"></span>
        <span>تحديث تلقائي كل 30 ثانية</span>
      </div>
    </div>

    <!-- ====== الملفات ====== -->
    <div class="panel" id="panel-files">
      <div class="admin-card">
        <div class="admin-row">
          <input id="filesRefresh" type="text" placeholder="اضغط تحديث لتحديث القائمة..." readonly style="cursor:pointer;">
          <button id="refreshFilesBtn">تحديث</button>
        </div>
      </div>
      <div id="filesList" class="list">
        <div class="loading"><div class="spinner"></div>جاري التحميل...</div>
      </div>
    </div>

    <!-- ====== الباقات ====== -->
    <div class="panel" id="panel-plans">
      <div id="plansList" class="list">
        <div class="loading"><div class="spinner"></div>جاري التحميل...</div>
      </div>
    </div>

  </div>
</div>

<!-- Modal: تعديل مستخدم -->
<div class="modal" id="userModal">
  <div class="modal-card">
    <h3 id="userModalTitle">تفاصيل المستخدم</h3>
    <div class="modal-subtitle" id="userModalPhone"></div>
    <div class="modal-meta" id="userModalMeta"></div>

    <label>الباقة</label>
    <select id="newPlanSelect"></select>

    <div class="grid-2">
      <div>
        <label>عدد التحميلات (اليوم)</label>
        <input id="downloadsInput" type="number" min="0" placeholder="0">
      </div>
      <div>
        <label>عدد الاستماعات (الشهر)</label>
        <input id="listensInput" type="number" min="0" placeholder="0">
      </div>
    </div>

    <label>ميعاد التجديد</label>
    <input id="renewalDateInput" type="date">

    <label>حد استماع مخصص (اتركه فاضي للافتراضي)</label>
    <input id="customListenInput" type="number" min="0" placeholder="مثال: 200">

    <div class="modal-actions">
      <button class="modal-btn primary" id="saveUserBtn">حفظ التغييرات</button>
      <button class="modal-btn secondary" onclick="closeUserModal()">إغلاق</button>
    </div>
  </div>
</div>

<!-- Modal: مشغل الفيديو -->
<div class="video-modal" id="videoModal">
  <div class="video-modal-card">
    <div class="video-modal-head">
      <div class="video-modal-title" id="videoTitle">—</div>
      <button class="close-x" onclick="closeVideoModal()">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div id="videoPlayerSlot"></div>
    <div class="video-modal-info" id="videoInfo"></div>
  </div>
</div>

<script>
// ==========================================
// 1. الإعدادات
// ==========================================
const SERVER_URL = "https://link2go-proxy.vercel.app";
const TOKEN_KEY = "link2go_admin_token";
const USERNAME_KEY = "link2go_admin_username";

let adminToken = localStorage.getItem(TOKEN_KEY) || "";
let adminUsername = localStorage.getItem(USERNAME_KEY) || "";
let allUsers = [];
let allPlans = {};
let currentEditingUser = null;
let refreshTimer = null;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");

// ==========================================
// 2. رسائل
// ==========================================
function showMsg(text, type = "ok"){
  const m = $("msg");
  m.textContent = text;
  m.className = "msg show " + type;
  setTimeout(() => { m.className = "msg"; }, 4000);
}

// ==========================================
// 3. تسجيل الدخول
// ==========================================
$("loginBtn").addEventListener("click", doLogin);
$("passwordInput").addEventListener("keydown", e => { if(e.key==="Enter") doLogin(); });
$("usernameInput").addEventListener("keydown", e => { if(e.key==="Enter") $("passwordInput").focus(); });

async function doLogin(){
  const username = $("usernameInput").value.trim();
  const password = $("passwordInput").value;
  const loginMsg = $("loginMsg");
  loginMsg.className = "login-msg";

  if (!username || !password){
    loginMsg.textContent = "من فضلك اكتب البيانات";
    loginMsg.className = "login-msg show err";
    return;
  }

  const btn = $("loginBtn");
  btn.textContent = "جاري التحقق...";
  btn.disabled = true;

  try {
    const r = await fetch(SERVER_URL + "/admin-login", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ username, password })
    });

    const d = await r.json();
    if (!r.ok || !d.success) throw new Error(d.error || "فشل تسجيل الدخول");

    adminToken = d.token;
    adminUsername = d.username;
    localStorage.setItem(TOKEN_KEY, adminToken);
    localStorage.setItem(USERNAME_KEY, adminUsername);

    $("loginScreen").classList.add("hidden");
    $("mainPanel").classList.add("show");
    $("welcomeText").textContent = "مرحباً " + adminUsername;

    startDashboard();
  } catch(e){
    console.error(e);
    loginMsg.textContent = e.message;
    loginMsg.className = "login-msg show err";
  } finally {
    btn.textContent = "تسجيل الدخول";
    btn.disabled = false;
  }
}

// ==========================================
// 4. تسجيل الخروج
// ==========================================
$("logoutBtn").addEventListener("click", () => {
  if (!confirm("هل أنت متأكد من تسجيل الخروج؟")) return;
  stopDashboard();
  localStorage.removeItem(TOKEN_KEY);
  localStorage.removeItem(USERNAME_KEY);
  adminToken = ""; adminUsername = "";
  location.reload();
});

// ==========================================
// 5. التحقق من التوكن
// ==========================================
async function checkAuth(){
  if (!adminToken){ showLoginScreen(); return false; }

  try {
    const r = await fetch(SERVER_URL + "/admin-verify", {
      method: "POST",
      headers: {"Authorization": "Bearer " + adminToken}
    });
    if (!r.ok){ showLoginScreen(); return false; }
    const d = await r.json();
    if (!d.success){ showLoginScreen(); return false; }
    adminUsername = d.username || adminUsername;
    return true;
  } catch(e){
    console.error(e);
    showLoginScreen();
    return false;
  }
}

function showLoginScreen(){
  $("loginScreen").classList.remove("hidden");
  $("mainPanel").classList.remove("show");
}

// ==========================================
// 6. API Fetch
// ==========================================
async function apiFetch(path, options = {}){
  const opts = {
    ...options,
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + adminToken,
      ...(options.headers || {})
    }
  };

  const r = await fetch(SERVER_URL + path, opts);

  if (r.status === 401){
    showLoginScreen();
    throw new Error("انتهت الجلسة، سجّل دخولك مجدداً");
  }

  const d = await r.json();
  if (!r.ok || !d.success) throw new Error(d.error || "فشل الطلب");
  return d;
}

// ==========================================
// 7. التابات
// ==========================================
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
    tab.classList.add("active");
    $("panel-" + tab.dataset.tab).classList.add("active");

    if (tab.dataset.tab === "users") loadUsers();
    if (tab.dataset.tab === "plans") loadPlans();
    if (tab.dataset.tab === "files") loadFiles();
  });
});

// ==========================================
// 8. المستخدمون
// ==========================================
async function loadUsers() {
  try {
    const d = await apiFetch("/users-list");
    allUsers = d.users || [];
    renderUsers(allUsers);
    updateStats();
  } catch (e) {
    console.error(e);
    $("usersList").innerHTML = `<div class="empty">❌ ${esc(e.message)}</div>`;
  }
}

function updateStats() {
  $("statTotal").textContent = allUsers.length;
  $("statFree").textContent = allUsers.filter(u => u.plan_id === 'free').length;
  $("statWeekly").textContent = allUsers.filter(u => u.plan_id === 'weekly').length;
  $("statMonthly").textContent = allUsers.filter(u => u.plan_id === 'monthly').length;
}

function renderUsers(users) {
  const container = $("usersList");
  if (!users.length) {
    container.innerHTML = `<div class="empty">مفيش مستخدمين</div>`;
    return;
  }

  container.innerHTML = "";
  users.forEach(u => {
    const el = document.createElement("div");
    el.className = "card";
    const planBadgeClass = u.plan_id === 'monthly' ? 'monthly' : u.plan_id === 'weekly' ? 'weekly' : 'free';
    const cancelledBadge = u.is_cancelled ? `<span class="badge cancelled">ملغي</span>` : "";
    const pendingBadge = u.upgrade_requested ? `<span class="badge pending">طلب ترقية</span>` : "";

    el.innerHTML = `
      <div class="card-head">
        <div style="flex:1;min-width:0;">
          <div class="card-title">${esc(u.username || "بدون اسم")}</div>
          <div class="card-phone">📱 ${esc(u.phone)}</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            <span class="badge ${planBadgeClass}">${esc(u.plan_name)}</span>
            ${cancelledBadge}
            ${pendingBadge}
          </div>
        </div>
        <div class="card-actions">
          <button class="card-btn primary" data-action="edit" data-phone="${esc(u.phone)}">تعديل</button>
        </div>
      </div>

      <div class="meta-row">
        <span>
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          تحميل: ${u.daily_downloads} / ${u.plan_limit === -1 ? '∞' : u.plan_limit}
        </span>
        <span>
          <svg viewBox="0 0 24 24"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>
          استماع: ${u.monthly_listens} / ${u.plan_listens_limit === -1 ? '∞' : u.plan_listens_limit}
        </span>
        ${u.renewal_date ? `<span>📅 تجديد: ${esc(u.renewal_date)}</span>` : ''}
      </div>
    `;

    el.querySelector('[data-action="edit"]').addEventListener("click", () => openUserModal(u.phone));
    container.appendChild(el);
  });
}

$("userSearch").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) { renderUsers(allUsers); return; }
  const filtered = allUsers.filter(u =>
    (u.username || "").toLowerCase().includes(q) ||
    (u.phone || "").includes(q)
  );
  renderUsers(filtered);
});

$("refreshUsersBtn").addEventListener("click", loadUsers);

// ==========================================
// 9. الباقات
// ==========================================
async function loadPlans() {
  try {
    const r = await fetch(SERVER_URL + "/get-plans");
    const d = await r.json();
    if (!r.ok || !d.success) throw new Error(d.error || "فشل");
    allPlans = d.plans || {};
    renderPlans(allPlans);
  } catch (e) {
    console.error(e);
    $("plansList").innerHTML = `<div class="empty">❌ ${esc(e.message)}</div>`;
  }
}

function renderPlans(plans) {
  const container = $("plansList");
  container.innerHTML = "";

  Object.keys(plans).forEach(planId => {
    const p = plans[planId];
    const el = document.createElement("div");
    el.className = "card";
    const badgeClass = planId === 'monthly' ? 'monthly' : planId === 'weekly' ? 'weekly' : 'free';

    el.innerHTML = `
      <div class="card-head">
        <div>
          <div class="card-title">${esc(p.name)}</div>
          <div class="card-phone" style="color:var(--muted);font-weight:400;">${p.price === 0 ? 'مجاناً' : p.price + ' جنيه / ' + p.duration_label}</div>
        </div>
        <span class="badge ${badgeClass}">${esc(planId.toUpperCase())}</span>
      </div>
      <div class="meta-row">
        <span>📥 تحميل يومي: ${p.limit === -1 ? '∞' : p.limit}</span>
        <span>🎧 استماع شهري: ${p.listens_limit === -1 ? '∞' : p.listens_limit}</span>
        <span>⏱️ مدة: ${p.duration_days > 0 ? p.duration_days + ' يوم' : 'دائم'}</span>
      </div>
      <div style="margin-top:10px;">
        <div class="stat-label" style="margin-bottom:6px;">المنصات المدعومة:</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          ${p.platforms.map(pl => `<span class="badge free" style="font-size:10.5px;">${esc(pl)}</span>`).join('')}
        </div>
      </div>
    `;
    container.appendChild(el);
  });
}

// ==========================================
// 10. الملفات (مع المشغل + الحذف)
// ==========================================
async function loadFiles() {
  $("filesList").innerHTML = `<div class="loading"><div class="spinner"></div>جاري التحميل...</div>`;

  try {
    const r = await fetch(SERVER_URL + "/files-list");
    const d = await r.json();
    if (!r.ok || !d.success) throw new Error(d.error || "فشل");
    renderFiles(d.files || []);
  } catch (e) {
    console.error(e);
    $("filesList").innerHTML = `<div class="empty">❌ ${esc(e.message)}</div>`;
  }
}

function renderFiles(files) {
  const container = $("filesList");

  if (!files.length) {
    container.innerHTML = `<div class="empty">مفيش ملفات حالياً</div>`;
    return;
  }

  container.innerHTML = "";
  files.forEach(f => {
    const el = document.createElement("div");
    el.className = "card";

    const largeBadge = f.is_large
      ? `<span class="badge large">🎬 ملف كبير (${f.ttl_minutes}د)</span>`
      : `<span class="badge free" style="font-size:10px;">⏱️ ${f.ttl_minutes}د</span>`;

    const typeBadge = f.requested_by?.type === 'audio'
      ? `<span class="badge audio">🎧 صوت</span>`
      : `<span class="badge video">🎬 فيديو</span>`;

    const ownerName = f.requested_by?.username || 'مجهول';
    const ownerPhone = f.requested_by?.phone || '—';

    el.innerHTML = `
      <div class="card-head">
        <div style="flex:1;min-width:0;">
          <div class="card-title" style="font-size:13px;" dir="ltr">${esc(f.filename.slice(0,40))}...</div>
          <div class="card-phone">👤 ${esc(ownerName)} • 📱 ${esc(ownerPhone)}</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            ${typeBadge}
            ${largeBadge}
          </div>
        </div>
        <div class="card-actions">
          <button class="card-btn primary" data-action="play" data-id="${esc(f.file_id)}" data-name="${esc(f.filename)}" data-owner="${esc(ownerName)}" data-phone="${esc(ownerPhone)}" data-type="${esc(f.requested_by?.type||'video')}" data-dur="${esc(f.duration_label)}" data-size="${esc(f.size_mb)}" data-date="${esc(f.created_at)}">
            <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3" fill="currentColor" stroke="none"/></svg>
            تشغيل
          </button>
          <a class="card-btn" href="${SERVER_URL}${f.download_url}" download>
            <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            تحميل
          </a>
          <button class="card-btn danger" data-action="delete" data-id="${esc(f.file_id)}">
            <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
            حذف
          </button>
        </div>
      </div>

      <div class="meta-row">
        <span>📦 ${f.size_mb} MB</span>
        <span>⏱️ ${esc(f.duration_label)}</span>
        <span>🕐 ${esc(f.created_at)}</span>
      </div>
    `;

    el.querySelector('[data-action="play"]').addEventListener("click", e => {
      const btn = e.currentTarget;
      openVideoModal(btn.dataset.id, btn.dataset.name, btn.dataset.owner, btn.dataset.phone, btn.dataset.type, btn.dataset.dur, btn.dataset.size, btn.dataset.date);
    });

    el.querySelector('[data-action="delete"]').addEventListener("click", async (e) => {
      const id = e.currentTarget.dataset.id;
      if (!confirm("هل أنت متأكد من حذف الملف ده؟")) return;
      try {
        await apiFetch(`/file/${encodeURIComponent(id)}/delete`, { method: "DELETE" });
        showMsg("✅ تم حذف الملف");
        loadFiles();
      } catch (err) {
        console.error(err);
        showMsg("❌ " + err.message, "err");
      }
    });

    container.appendChild(el);
  });
}

$("refreshFilesBtn").addEventListener("click", loadFiles);
$("filesRefresh").addEventListener("click", loadFiles);

// ==========================================
// 11. مشغل الفيديو المدمج
// ==========================================
function openVideoModal(fileId, filename, owner, phone, type, duration, size, date) {
  const isAudio = (type === 'audio');
  const url = `${SERVER_URL}/file/${fileId}?inline=true`;

  $("videoTitle").textContent = filename;

  const slot = $("videoPlayerSlot");
  slot.innerHTML = "";

  if (isAudio) {
    const audio = document.createElement("audio");
    audio.controls = true;
    audio.autoplay = true;
    audio.src = url;
    slot.appendChild(audio);
  } else {
    const video = document.createElement("video");
    video.controls = true;
    video.autoplay = true;
    video.playsInline = true;
    video.src = url;
    slot.appendChild(video);
  }

  $("videoInfo").innerHTML = `
    <span>👤 ${esc(owner)}</span>
    <span>📱 ${esc(phone)}</span>
    <span>⏱️ ${esc(duration)}</span>
    <span>📦 ${esc(size)} MB</span>
    <span>🕐 ${esc(date)}</span>
  `;

  $("videoModal").classList.add("active");
  document.body.style.overflow = "hidden";
}

function closeVideoModal() {
  $("videoModal").classList.remove("active");
  $("videoPlayerSlot").innerHTML = "";
  document.body.style.overflow = "";
}

$("videoModal").addEventListener("click", e => {
  if (e.target.id === "videoModal") closeVideoModal();
});

// ==========================================
// 12. Modal: تعديل مستخدم
// ==========================================
async function openUserModal(phone) {
  $("userModal").classList.add("active");
  $("userModalTitle").textContent = "جاري التحميل...";
  $("userModalPhone").textContent = "";
  $("userModalMeta").innerHTML = "";

  try {
    const d = await apiFetch("/user/" + encodeURIComponent(phone));
    currentEditingUser = d.user;

    if (!Object.keys(allPlans).length){
      await loadPlans();
    }
    renderUserModal(d.user);
  } catch (e) {
    console.error(e);
    $("userModalTitle").textContent = "خطأ";
    $("userModalPhone").textContent = e.message;
  }
}

function renderUserModal(u) {
  $("userModalTitle").textContent = u.username || "مستخدم";
  $("userModalPhone").textContent = "📱 " + u.phone;

  const metaParts = [];
  if (u.created_at) metaParts.push(`🗓️ التسجيل: ${esc(u.created_at)}`);
  if (u.last_login) metaParts.push(`🔐 آخر دخول: ${esc(u.last_login)}`);
  if (u.upgrade_requested) metaParts.push(`⭐ طلب ترقية: ${esc(u.upgrade_requested)}`);
  $("userModalMeta").innerHTML = metaParts.map(p => `<span>${p}</span>`).join('');

  const planOptions = Object.keys(allPlans).map(pid =>
    `<option value="${pid}" ${pid === u.plan_id ? 'selected' : ''}>${esc(allPlans[pid].name)}</option>`
  ).join('');
  $("newPlanSelect").innerHTML = planOptions;

  $("downloadsInput").value = u.daily_downloads || 0;
  $("listensInput").value = u.monthly_listens || 0;
  $("renewalDateInput").value = u.renewal_date || "";
  $("customListenInput").value = "";
}

$("saveUserBtn").addEventListener("click", async () => {
  if (!currentEditingUser) return;
  const btn = $("saveUserBtn");
  btn.textContent = "جاري الحفظ...";
  btn.disabled = true;

  try {
    const phone = currentEditingUser.phone;

    const newPlan = $("newPlanSelect").value;
    if (newPlan !== currentEditingUser.plan_id){
      await apiFetch(`/user/${encodeURIComponent(phone)}/set-plan`, {
        method: "POST",
        body: JSON.stringify({ plan: newPlan })
      });
    }

    const body = {
      daily_downloads: parseInt($("downloadsInput").value) || 0,
      monthly_listens: parseInt($("listensInput").value) || 0,
      renewal_date: $("renewalDateInput").value || ""
    };

    const customListen = $("customListenInput").value.trim();
    if (customListen !== ""){
      body.listens_limit = parseInt(customListen);
    }

    await apiFetch(`/user/${encodeURIComponent(phone)}/set-counters`, {
      method: "POST",
      body: JSON.stringify(body)
    });

    showMsg("✅ تم حفظ التغييرات بنجاح");
    closeUserModal();
    loadUsers();
  } catch (e) {
    console.error(e);
    showMsg("❌ " + e.message, "err");
  } finally {
    btn.textContent = "حفظ التغييرات";
    btn.disabled = false;
  }
});

function closeUserModal() {
  $("userModal").classList.remove("active");
  currentEditingUser = null;
}

$("userModal").addEventListener("click", e => {
  if (e.target.id === "userModal") closeUserModal();
});

// ==========================================
// 13. Real-time refresh
// ==========================================
function startRefresh(){
  stopRefresh();
  refreshTimer = setInterval(() => {
    if (document.hidden) return;
    const usersTab = document.querySelector('.tab[data-tab="users"].active');
    if (usersTab) loadUsers();
  }, 30000);
}

function stopRefresh(){
  if (refreshTimer){ clearInterval(refreshTimer); refreshTimer = null; }
}

// ==========================================
// 14. تشغيل
// ==========================================
function startDashboard(){
  loadUsers();
  startRefresh();
}

function stopDashboard(){
  stopRefresh();
}

(async function init(){
  const ok = await checkAuth();
  if (ok){
    $("loginScreen").classList.add("hidden");
    $("mainPanel").classList.add("show");
    $("welcomeText").textContent = "مرحباً " + adminUsername;
    startDashboard();
  } else {
    showLoginScreen();
  }
})();
</script>

</body>
</html>
