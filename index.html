<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Link2Go — لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#08070d;
  --bg-2:#0d0c15;
  --surface:rgba(22,20,35,.72);
  --surface-2:rgba(30,27,48,.85);
  --border:rgba(168,132,255,.14);
  --border-2:rgba(168,132,255,.28);
  --text:#f5f3ff;
  --muted:#a09db8;
  --muted-2:#6b6885;
  --accent:#a855f7;
  --accent-2:#7c3aed;
  --accent-3:#c084fc;
  --success:#10b981;
  --danger:#ef4444;
  --warning:#f59e0b;
  --info:#3b82f6;
  --glow:0 0 40px rgba(168,85,247,.3);
}
html,body{min-height:100%;}
body{
  font-family:'Cairo',system-ui,-apple-system,sans-serif;
  background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(168,85,247,.18),transparent),
             radial-gradient(ellipse 60% 40% at 80% 100%,rgba(124,58,237,.12),transparent),
             linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 100%);
  background-attachment:fixed;
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:'';position:fixed;inset:0;
  background:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' /%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.02'/%3E%3C/svg%3E");
  pointer-events:none;z-index:0;
}

/* ============ رسائل ============ */
.toast{
  position:fixed;top:24px;left:50%;transform:translate(-50%,-120%);
  padding:14px 26px;border-radius:14px;
  background:rgba(22,20,35,.95);
  border:1px solid var(--border-2);
  backdrop-filter:blur(20px);
  font-size:13.5px;font-weight:700;
  z-index:9999;
  transition:transform .4s cubic-bezier(.16,1,.3,1);
  box-shadow:0 20px 60px rgba(0,0,0,.5);
  display:flex;align-items:center;gap:10px;
  max-width:90vw;
}
.toast.show{transform:translate(-50%,0);}
.toast.ok{border-color:rgba(16,185,129,.4);color:#6ee7b7;}
.toast.err{border-color:rgba(239,68,68,.4);color:#fca5a5;}

/* ============ شاشة الدخول ============ */
#loginScreen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:20px;position:relative;z-index:1;
}
.login-card{
  width:100%;max-width:400px;
  background:linear-gradient(145deg,rgba(30,27,48,.9),rgba(20,18,32,.95));
  border:1px solid var(--border-2);
  border-radius:24px;padding:42px 32px;
  position:relative;overflow:hidden;
  box-shadow:0 30px 90px rgba(0,0,0,.7),var(--glow);
  animation:cardIn .6s cubic-bezier(.16,1,.3,1);
}
@keyframes cardIn{from{opacity:0;transform:translateY(20px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
.login-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,transparent,var(--accent),var(--accent-3),transparent);
  background-size:200% 100%;
  animation:shine 3s linear infinite;
}
@keyframes shine{to{background-position:200% center;}}

.login-logo{
  width:72px;height:72px;border-radius:20px;margin:0 auto 20px;
  display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  box-shadow:0 15px 40px rgba(168,85,247,.5),inset 0 1px 0 rgba(255,255,255,.2);
  font-size:32px;
}
.login-card h2{
  font-size:24px;font-weight:800;text-align:center;margin-bottom:6px;
  background:linear-gradient(135deg,#fff,var(--accent-3));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.login-card p{text-align:center;color:var(--muted);font-size:13px;margin-bottom:28px;}

.input-group{margin-bottom:16px;text-align:right;}
.input-group label{
  display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px;
}
.input-group input{
  width:100%;padding:14px 16px;border-radius:12px;
  background:rgba(10,9,16,.6);
  border:1px solid var(--border);
  color:var(--text);font-family:inherit;font-size:14px;
  outline:none;transition:all .25s;
}
.input-group input:focus{
  border-color:var(--accent);
  background:rgba(10,9,16,.9);
  box-shadow:0 0 0 4px rgba(168,85,247,.12);
}

.btn-primary{
  width:100%;padding:14px;border-radius:13px;border:0;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;font-family:inherit;font-size:15px;font-weight:800;
  cursor:pointer;transition:all .25s;
  box-shadow:0 12px 35px rgba(168,85,247,.35);
  margin-top:8px;
}
.btn-primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 17px 45px rgba(168,85,247,.5);}
.btn-primary:active{transform:scale(.98);}
.btn-primary:disabled{opacity:.6;cursor:wait;}

.login-msg{
  display:none;margin-top:14px;padding:11px 14px;border-radius:11px;
  font-size:12.5px;text-align:center;font-weight:600;
}
.login-msg.show{display:block;}
.login-msg.err{background:rgba(239,68,68,.1);color:#fca5a5;border:1px solid rgba(239,68,68,.25);}

/* ============ اللوحة الرئيسية ============ */
#mainPanel{display:none;position:relative;z-index:1;}
#mainPanel.show{display:block;}

.wrap{width:min(1240px,94%);margin:0 auto;padding:28px 0 80px;}

/* الهيدر */
.app-header{
  display:flex;justify-content:space-between;align-items:center;
  padding:20px 0 24px;
  border-bottom:1px solid var(--border);
  margin-bottom:28px;
  flex-wrap:wrap;gap:14px;
}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;}
.brand-icon{
  width:44px;height:44px;border-radius:13px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:grid;place-items:center;
  box-shadow:0 10px 30px rgba(168,85,247,.4);
  font-size:22px;
}
.brand-text strong{display:block;font-size:17px;font-weight:900;letter-spacing:-.3px;}
.brand-text span{display:block;color:var(--muted);font-size:11.5px;margin-top:2px;font-weight:500;}

.header-actions{display:flex;gap:10px;flex-wrap:wrap;}
.icon-btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 16px;border-radius:11px;
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text);font-family:inherit;font-size:12.5px;font-weight:700;
  cursor:pointer;transition:all .25s;text-decoration:none;
  backdrop-filter:blur(10px);
}
.icon-btn:hover{
  background:var(--surface-2);
  border-color:var(--border-2);
  transform:translateY(-1px);
}
.icon-btn.danger:hover{
  border-color:rgba(239,68,68,.5);
  color:#fca5a5;
}
.icon-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}

/* التابات */
.tabs{
  display:flex;gap:6px;margin-bottom:24px;
  background:var(--surface);
  padding:6px;border-radius:16px;
  border:1px solid var(--border);
  width:fit-content;max-width:100%;
  backdrop-filter:blur(20px);
  overflow-x:auto;
}
.tabs::-webkit-scrollbar{display:none;}
.tab{
  padding:11px 20px;border-radius:11px;border:0;
  background:transparent;color:var(--muted);
  font-family:inherit;font-size:13.5px;font-weight:700;
  cursor:pointer;transition:all .25s;
  display:inline-flex;align-items:center;gap:8px;
  white-space:nowrap;
}
.tab:hover{color:var(--text);}
.tab.active{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;
  box-shadow:0 10px 30px rgba(168,85,247,.4);
}
.tab svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}

.panel{display:none;}
.panel.active{display:block;animation:panelIn .4s cubic-bezier(.16,1,.3,1);}
@keyframes panelIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}

/* الإحصائيات */
.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:14px;margin-bottom:24px;
}
.stat{
  background:linear-gradient(145deg,rgba(30,27,48,.7),rgba(20,18,32,.85));
  border:1px solid var(--border);
  border-radius:16px;padding:20px;
  position:relative;overflow:hidden;
  transition:all .3s;
}
.stat:hover{
  border-color:var(--border-2);
  transform:translateY(-3px);
  box-shadow:0 20px 50px rgba(0,0,0,.4);
}
.stat::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--accent),var(--accent-3));
  opacity:.6;
}
.stat.blue::before{background:linear-gradient(90deg,#3b82f6,#60a5fa);}
.stat.green::before{background:linear-gradient(90deg,#10b981,#34d399);}
.stat.gold::before{background:linear-gradient(90deg,#f59e0b,#fbbf24);}

.stat-icon{
  width:38px;height:38px;border-radius:11px;
  background:rgba(168,85,247,.15);
  display:grid;place-items:center;
  margin-bottom:12px;font-size:18px;
}
.stat.blue .stat-icon{background:rgba(59,130,246,.15);}
.stat.green .stat-icon{background:rgba(16,185,129,.15);}
.stat.gold .stat-icon{background:rgba(245,158,11,.15);}

.stat-label{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px;}
.stat-value{font-size:26px;font-weight:900;letter-spacing:-.5px;line-height:1;}
.stat.blue .stat-value{color:#60a5fa;}
.stat.green .stat-value{color:#34d399;}
.stat.gold .stat-value{color:#fbbf24;}

/* شريط البحث */
.search-bar{
  display:flex;gap:10px;margin-bottom:20px;
  flex-wrap:wrap;
}
.search-bar input{
  flex:1;min-width:220px;
  padding:13px 18px;border-radius:12px;
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text);font-family:inherit;font-size:13.5px;
  outline:none;transition:all .25s;
  backdrop-filter:blur(10px);
}
.search-bar input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 4px rgba(168,85,247,.12);
}
.search-bar button{
  padding:13px 22px;border-radius:12px;border:0;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;font-family:inherit;font-size:13px;font-weight:800;
  cursor:pointer;transition:all .25s;
  box-shadow:0 10px 30px rgba(168,85,247,.3);
  display:inline-flex;align-items:center;gap:7px;
}
.search-bar button:hover{transform:translateY(-2px);box-shadow:0 15px 40px rgba(168,85,247,.5);}

/* الكروت */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;}

.card{
  background:linear-gradient(145deg,rgba(30,27,48,.65),rgba(20,18,32,.85));
  border:1px solid var(--border);
  border-radius:16px;padding:18px;
  transition:all .3s;
  position:relative;overflow:hidden;
  backdrop-filter:blur(10px);
}
.card:hover{
  border-color:var(--border-2);
  transform:translateY(-3px);
  box-shadow:0 25px 60px rgba(0,0,0,.5);
}

.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
.card-title{font-size:15px;font-weight:800;margin-bottom:4px;letter-spacing:-.2px;}
.card-phone{font-size:12.5px;color:var(--accent-3);direction:ltr;text-align:right;font-weight:600;}

.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;}
.badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:4px 10px;border-radius:100px;
  font-size:10.5px;font-weight:800;letter-spacing:.2px;
}
.badge.free{background:rgba(148,163,184,.15);color:#cbd5e1;}
.badge.weekly{background:rgba(59,130,246,.2);color:#93c5fd;}
.badge.monthly{background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#000;}
.badge.success{background:rgba(16,185,129,.18);color:#6ee7b7;}
.badge.failed{background:rgba(239,68,68,.18);color:#fca5a5;}
.badge.quota{background:rgba(245,158,11,.18);color:#fcd34d;}
.badge.cancelled{background:rgba(239,68,68,.15);color:#fca5a5;}
.badge.pending{background:rgba(245,158,11,.15);color:#fcd34d;}
.badge.stream{background:rgba(168,85,247,.2);color:#d8b4fe;}
.badge.download{background:rgba(59,130,246,.2);color:#93c5fd;}
.badge.video{background:rgba(59,130,246,.15);color:#93c5fd;}
.badge.cache{background:rgba(16,185,129,.2);color:#6ee7b7;}

.meta-row{
  display:flex;gap:14px;flex-wrap:wrap;
  margin-top:10px;padding-top:12px;
  border-top:1px dashed rgba(168,132,255,.12);
  font-size:11.5px;color:var(--muted);font-weight:600;
}
.meta-row span{display:inline-flex;align-items:center;gap:5px;}

.card-actions{display:flex;gap:6px;flex-wrap:wrap;}

.card-btn{
  padding:8px 14px;border-radius:9px;
  background:rgba(168,85,247,.1);
  border:1px solid var(--border);
  color:var(--text);font-family:inherit;font-size:12px;font-weight:700;
  cursor:pointer;transition:all .2s;
  display:inline-flex;align-items:center;gap:6px;text-decoration:none;
}
.card-btn:hover{
  background:var(--surface-2);
  border-color:var(--border-2);
  transform:translateY(-1px);
}
.card-btn.primary{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  border-color:transparent;color:#fff;
  box-shadow:0 8px 25px rgba(168,85,247,.35);
}
.card-btn.primary:hover{box-shadow:0 12px 35px rgba(168,85,247,.5);}
.card-btn.danger{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3);color:#fca5a5;}
.card-btn.danger:hover{background:rgba(239,68,68,.25);color:#fff;}
.card-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}

.empty,.loading{
  grid-column:1/-1;
  padding:60px 20px;text-align:center;
  color:var(--muted);font-size:13.5px;font-weight:600;
}
.loading::before{
  content:'';display:block;
  width:36px;height:36px;margin:0 auto 16px;
  border:3px solid rgba(168,85,247,.2);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* ============ الباقات ============ */
.plans-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:16px;
}
.plan-card{
  background:linear-gradient(145deg,rgba(30,27,48,.75),rgba(20,18,32,.9));
  border:1px solid var(--border);
  border-radius:20px;padding:24px;
  position:relative;overflow:hidden;
  transition:all .3s;
  display:flex;flex-direction:column;
}
.plan-card:hover{
  transform:translateY(-5px);
  border-color:var(--border-2);
  box-shadow:0 30px 70px rgba(0,0,0,.5);
}
.plan-card.featured{
  border-color:rgba(168,85,247,.4);
  background:linear-gradient(145deg,rgba(45,25,75,.85),rgba(30,20,50,.95));
  box-shadow:0 20px 60px rgba(168,85,247,.2);
}
.plan-card.featured::before{
  content:'⭐ الأكثر طلباً';
  position:absolute;top:14px;left:14px;
  padding:5px 12px;border-radius:100px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;font-size:10.5px;font-weight:800;
  box-shadow:0 6px 20px rgba(168,85,247,.5);
}
.plan-head{
  display:flex;justify-content:space-between;align-items:flex-start;
  margin-bottom:16px;
}
.plan-icon{
  width:52px;height:52px;border-radius:14px;
  display:grid;place-items:center;font-size:24px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  box-shadow:0 10px 30px rgba(168,85,247,.35);
}
.plan-icon.free{background:linear-gradient(135deg,#64748b,#94a3b8);box-shadow:0 10px 30px rgba(100,116,139,.3);}
.plan-icon.weekly{background:linear-gradient(135deg,#3b82f6,#60a5fa);box-shadow:0 10px 30px rgba(59,130,246,.35);}
.plan-icon.monthly{background:linear-gradient(135deg,#f59e0b,#fbbf24);box-shadow:0 10px 30px rgba(245,158,11,.4);color:#000;}

.plan-price{text-align:left;}
.plan-price .amount{
  font-size:28px;font-weight:900;letter-spacing:-1px;line-height:1;
  display:block;
}
.plan-price .label{font-size:11.5px;color:var(--muted);margin-top:4px;display:block;font-weight:600;}

.plan-name{
  font-size:17px;font-weight:900;margin-bottom:6px;
  letter-spacing:-.3px;
}
.plan-desc{font-size:12.5px;color:var(--muted);margin-bottom:18px;line-height:1.6;}

.plan-features{list-style:none;display:flex;flex-direction:column;gap:10px;flex:1;}
.plan-features li{
  display:flex;align-items:flex-start;gap:9px;
  font-size:12.5px;color:#d5d2e8;line-height:1.5;font-weight:500;
}
.plan-features li::before{
  content:'✓';
  flex-shrink:0;width:18px;height:18px;
  border-radius:50%;
  background:rgba(16,185,129,.15);
  color:#6ee7b7;
  display:grid;place-items:center;
  font-size:11px;font-weight:900;
  margin-top:1px;
}
.plan-features li.x-feature{color:var(--muted-2);}
.plan-features li.x-feature::before{
  content:'✕';
  background:rgba(239,68,68,.1);
  color:#f87171;
}

.plan-platforms{
  margin-top:16px;padding-top:16px;
  border-top:1px dashed rgba(168,132,255,.15);
}
.plan-platforms-label{
  font-size:10.5px;color:var(--muted);font-weight:700;
  margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px;
}
.plan-platforms-list{
  display:flex;gap:6px;flex-wrap:wrap;
}
.platform-chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 10px;border-radius:100px;
  background:rgba(168,85,247,.1);
  border:1px solid rgba(168,132,255,.18);
  font-size:10.5px;font-weight:700;
  color:#d8b4fe;
}
.platform-chip.all{
  background:linear-gradient(135deg,rgba(245,158,11,.2),rgba(251,191,36,.15));
  border-color:rgba(245,158,11,.4);
  color:#fbbf24;
}

/* ============ Sub tabs ============ */
.sub-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.sub-tab{
  padding:8px 14px;border-radius:10px;
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--muted);font-family:inherit;font-size:12px;font-weight:700;
  cursor:pointer;transition:all .2s;
}
.sub-tab:hover{color:var(--text);border-color:var(--border-2);}
.sub-tab.active{
  background:rgba(168,85,247,.15);
  border-color:rgba(168,132,255,.4);
  color:var(--accent-3);
}
.sub-tab.danger{margin-inline-start:auto;color:#fca5a5;border-color:rgba(239,68,68,.3);}
.sub-tab.danger:hover{background:rgba(239,68,68,.15);color:#fff;}

/* ============ Modal ============ */
.modal{
  position:fixed;inset:0;z-index:2000;
  background:rgba(5,4,10,.85);
  backdrop-filter:blur(15px);
  display:none;align-items:center;justify-content:center;
  padding:20px;
}
.modal.active{display:flex;animation:fadeIn .3s ease;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

.modal-content{
  width:100%;max-width:540px;
  background:linear-gradient(145deg,rgba(30,27,48,.98),rgba(20,18,32,.99));
  border:1px solid var(--border-2);
  border-radius:22px;padding:28px;
  max-height:92vh;overflow-y:auto;
  position:relative;overflow-x:hidden;
  box-shadow:0 40px 100px rgba(0,0,0,.8),var(--glow);
  animation:modalIn .45s cubic-bezier(.16,1,.3,1);
}
.modal-content.wide{max-width:720px;}
@keyframes modalIn{from{opacity:0;transform:scale(.92) translateY(20px);}to{opacity:1;transform:scale(1) translateY(0);}}
.modal-content::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,transparent,var(--accent),var(--accent-3),transparent);
  background-size:200% 100%;animation:shine 3s linear infinite;
}

.modal-header{
  display:flex;justify-content:space-between;align-items:flex-start;
  margin-bottom:20px;gap:12px;
}
.modal-header h3{
  font-size:18px;font-weight:900;letter-spacing:-.3px;
  background:linear-gradient(135deg,#fff,var(--accent-3));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.close-btn{
  width:34px;height:34px;border-radius:10px;
  background:rgba(239,68,68,.1);
  border:1px solid rgba(239,68,68,.25);
  color:#fca5a5;
  cursor:pointer;transition:all .2s;
  display:grid;place-items:center;flex-shrink:0;
  font-size:18px;font-family:inherit;
}
.close-btn:hover{background:rgba(239,68,68,.25);color:#fff;transform:rotate(90deg);}

.modal-phone{
  color:var(--accent-3);font-size:13px;font-weight:700;
  direction:ltr;text-align:right;margin-bottom:10px;
}
.modal-meta{
  display:flex;gap:12px;flex-wrap:wrap;
  padding:10px 0 18px;
  border-bottom:1px dashed rgba(168,132,255,.15);
  margin-bottom:16px;
  font-size:11.5px;color:var(--muted);font-weight:600;
}

/* Form fields */
.field{margin-bottom:14px;text-align:right;}
.field label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px;}
.field input,.field select{
  width:100%;padding:12px 14px;border-radius:11px;
  background:rgba(10,9,16,.7);
  border:1px solid var(--border);
  color:var(--text);font-family:inherit;font-size:13.5px;
  outline:none;transition:all .25s;
}
.field input:focus,.field select:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 4px rgba(168,85,247,.12);
}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

.modal-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;}

.btn{
  padding:12px 20px;border-radius:12px;border:0;
  font-family:inherit;font-size:13.5px;font-weight:800;
  cursor:pointer;transition:all .25s;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
}
.btn.primary{
  flex:1;background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;box-shadow:0 10px 30px rgba(168,85,247,.35);
}
.btn.primary:hover{transform:translateY(-2px);box-shadow:0 15px 40px rgba(168,85,247,.5);}
.btn.danger{
  background:rgba(239,68,68,.1);
  border:1px solid rgba(239,68,68,.3);
  color:#fca5a5;
}
.btn.danger:hover{background:rgba(239,68,68,.25);color:#fff;}

/* Video player */
.video-slot{
  width:100%;background:#000;
  border-radius:14px;overflow:hidden;
  display:flex;justify-content:center;align-items:center;
  min-height:240px;
}
.video-slot video{width:100%;display:block;border-radius:14px;max-height:60vh;}
.video-slot audio{width:100%;padding:20px;}

/* Responsive */
@media(max-width:700px){
  .wrap{padding:20px 0 60px;}
  .app-header{padding:14px 0 18px;}
  .brand-text strong{font-size:15px;}
  .stats{grid-template-columns:repeat(2,1fr);}
  .stat{padding:16px;}
  .stat-value{font-size:20px;}
  .list{grid-template-columns:1fr;}
  .plans-grid{grid-template-columns:1fr;}
  .tab{padding:9px 14px;font-size:12.5px;}
  .modal-content{padding:22px;}
  .field-row{grid-template-columns:1fr;}
  .plan-card{padding:20px;}
  .icon-btn{padding:9px 12px;font-size:11.5px;}
  .icon-btn span{display:none;}
}
</style>
</head>
<body>

<div id="toast" class="toast"></div>

<!-- شاشة الدخول -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">🔐</div>

</div>

<!-- اللوحة الرئيسية -->
<div id="mainPanel">
  <div class="wrap">

    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">⚡</div>
        <div class="brand-text">
          <strong>Link2Go Admin</strong>
          <span id="welcomeText">مرحباً</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="refreshBtn" class="icon-btn">
          <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          <span>تحديث</span>
        </button>
        <button id="logoutBtn" class="icon-btn danger">
          <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span>خروج</span>
        </button>
      </div>
    </header>

    <div class="tabs">
      <button class="tab active" data-tab="users">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        المستخدمون
      </button>
      <button class="tab" data-tab="plans">
        <svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/></svg>
        الباقات
      </button>
      <button class="tab" data-tab="history">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        السجلات
      </button>
    </div>

    <!-- ============ المستخدمون ============ -->
    <div class="panel active" id="panel-users">
      <div class="stats">
        <div class="stat green">
          <div class="stat-icon">👥</div>
          <div class="stat-label">إجمالي المستخدمين</div>
          <div class="stat-value" id="statTotal">0</div>
        </div>
        <div class="stat blue">
          <div class="stat-icon">💙</div>
          <div class="stat-label">الباقة المجانية</div>
          <div class="stat-value" id="statFree">0</div>
        </div>
        <div class="stat">
          <div class="stat-icon">💜</div>
          <div class="stat-label">الباقة الأسبوعية</div>
          <div class="stat-value" id="statWeekly">0</div>
        </div>
        <div class="stat gold">
          <div class="stat-icon">👑</div>
          <div class="stat-label">الباقة الشهرية VIP</div>
          <div class="stat-value" id="statMonthly">0</div>
        </div>
      </div>

      <div class="search-bar">
        <input id="userSearch" type="text" placeholder="🔍 ابحث بالاسم أو رقم الهاتف...">
        <button id="refreshUsersBtn">
          <svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          تحديث
        </button>
      </div>

      <div id="usersList" class="list">
        <div class="loading">جاري التحميل...</div>
      </div>
    </div>

    <!-- ============ الباقات ============ -->
    <div class="panel" id="panel-plans">
      <div id="plansList" class="plans-grid">
        <div class="loading">جاري التحميل...</div>
      </div>
    </div>

    <!-- ============ السجلات ============ -->
    <div class="panel" id="panel-history">
      <div class="sub-tabs">
        <button class="sub-tab active" data-htype="links">📥 الروابط</button>
        <button class="sub-tab" data-htype="otp">🔐 OTP</button>
        <button class="sub-tab" data-htype="login">🔑 تسجيل الدخول</button>
      </div>
      <div class="search-bar">
        <input id="historySearch" type="text" placeholder="🔍 ابحث في السجل...">
        <button id="refreshHistoryBtn">
          <svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          تحديث
        </button>
      </div>
      <div id="historyList" class="list">
        <div class="loading">جاري التحميل...</div>
      </div>
    </div>

  </div>
</div>

<!-- مودال تعديل المستخدم -->
<div id="userModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="userModalTitle">تعديل المستخدم</h3>
      <button class="close-btn" onclick="closeUserModal()">✕</button>
    </div>
    <div class="modal-phone" id="userModalPhone"></div>
    <div class="modal-meta" id="userModalMeta"></div>

    <div class="field">
      <label>الباقة</label>
      <select id="newPlanSelect"></select>
    </div>

    <div class="field-row">
      <div class="field">
        <label>التحميلات (اليوم)</label>
        <input type="number" id="downloadsInput" min="0">
      </div>
      <div class="field">
        <label>الاستماعات (الشهر)</label>
        <input type="number" id="listensInput" min="0">
      </div>
    </div>

    <div class="field">
      <label>ميعاد التجديد (YYYY-MM-DD)</label>
      <input type="text" id="renewalDateInput" placeholder="2026-12-31">

    <div class="field">
      <label>حد استماع مخصص (-1 = بلا حدود)</label>
      <input type="number" id="customListenInput" placeholder="اتركه فاضي للافتراضي">
    </div>

    <div class="modal-actions">
      <button id="saveUserBtn" class="btn primary">💾 حفظ التغييرات</button>
      <button id="deleteUserBtn" class="btn danger">🗑️ حذف</button>
    </div>
  </div>
</div>

<!-- مودال المشغل -->
<div id="videoModal" class="modal">
  <div class="modal-content wide">
    <div class="modal-header">
      <h3 id="videoTitle">معاينة الملف</h3>
      <button class="close-btn" onclick="closeVideoModal()">✕</button>
    </div>
    <div class="video-slot" id="videoPlayerSlot"></div>
    <div class="meta-row" id="videoInfo"></div>
  </div>
</div>

<script>
// ==========================================
// الإعدادات
// ==========================================
const SERVER_URL = "https://link2go-proxy.vercel.app";
const TOKEN_KEY = "link2go_admin_token";
const USERNAME_KEY = "link2go_admin_username";

let adminToken = sessionStorage.getItem(TOKEN_KEY) || "";
let adminUsername = sessionStorage.getItem(USERNAME_KEY) || "";
let allUsers = [], allPlans = {}, currentEditingUser = null;
let currentHistoryType = "links";
let allHistory = { links: [], otp: [], login: [] };
let refreshTimer = null;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
const todayStr = () => new Date().toLocaleDateString("en-CA");

// ==========================================
// Toast
// ==========================================
function showToast(text, type = "ok") {
  const t = $("toast");
  t.textContent = text;
  t.className = "toast show " + type;
  setTimeout(() => { t.className = "toast"; }, 3500);
}

// ==========================================
// Session
// ==========================================
function clearSession() {
  sessionStorage.removeItem(TOKEN_KEY);
  sessionStorage.removeItem(USERNAME_KEY);
  adminToken = ""; adminUsername = "";
}
function showLoginScreen() {
  $("loginScreen").style.display = "flex";
  $("mainPanel").classList.remove("show");
}
function hideLoginScreen() {
  $("loginScreen").style.display = "none";
  $("mainPanel").classList.add("show");
}
function forceLogout() { stopRefresh(); clearSession(); showLoginScreen(); }

// ==========================================
// API
// ==========================================
async function apiFetch(path, options = {}) {
  const r = await fetch(SERVER_URL + path, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      "Authorization": "Bearer " + adminToken,
      ...(options.headers || {})
    }
  });
  let d = {};
  try { d = await r.json(); } catch (_) {}
  if (r.status === 401) { forceLogout(); throw new Error(d.error || "انتهت الجلسة"); }
  if (r.status === 429) throw new Error(d.error || "طلبات كتير، استنى شوية");
  if (!r.ok || !d.success) throw new Error(d.error || `فشل الطلب (${r.status})`);
  return d;
}

// ==========================================
// Login
// ==========================================
$("loginBtn").addEventListener("click", doLogin);
$("passwordInput").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
$("usernameInput").addEventListener("keydown", e => { if (e.key === "Enter") $("passwordInput").focus(); });

async function doLogin() {
  const username = $("usernameInput").value.trim();
  const password = $("passwordInput").value;
  const loginMsg = $("loginMsg");
  loginMsg.className = "login-msg";

  if (!username || !password) {
    loginMsg.textContent = "من فضلك اكتب البيانات";
    loginMsg.className = "login-msg show err";
    return;
  }

  const btn = $("loginBtn");
  btn.textContent = "جاري التحقق...";
  btn.disabled = true;

  try {
    const r = await fetch(SERVER_URL + "/admin-login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });
    let d = {};
    try { d = await r.json(); } catch (_) {}
    if (!r.ok || !d.success) throw new Error(d.error || "فشل تسجيل الدخول");

    adminToken = d.token;
    adminUsername = d.username;
    sessionStorage.setItem(TOKEN_KEY, adminToken);
    sessionStorage.setItem(USERNAME_KEY, adminUsername);

    $("passwordInput").value = "";
    hideLoginScreen();
    $("welcomeText").textContent = "مرحباً " + adminUsername;
    startDashboard();
  } catch (e) {
    loginMsg.textContent = e.message;
    loginMsg.className = "login-msg show err";
  } finally {
    btn.textContent = "تسجيل الدخول";
    btn.disabled = false;
  }
}

// ==========================================
// Logout
// ==========================================
$("logoutBtn").addEventListener("click", async () => {
  if (!confirm("هل أنت متأكد من تسجيل الخروج؟")) return;
  try {
    await fetch(SERVER_URL + "/admin-logout", {
      method: "POST",
      headers: { "Authorization": "Bearer " + adminToken }
    });
  } catch (_) {}
  stopRefresh();
  clearSession();
  location.reload();
});

// ==========================================
// Check Auth
// ==========================================
async function checkAuth() {
  if (!adminToken) return false;
  try {
    const r = await fetch(SERVER_URL + "/admin-verify", {
      method: "POST",
      headers: { "Authorization": "Bearer " + adminToken }
    });
    if (!r.ok) { clearSession(); return false; }
    const d = await r.json();
    if (!d.success) { clearSession(); return false; }
    adminUsername = d.username || adminUsername;
    return true;
  } catch (_) { return false; }
}

// ==========================================
// Tabs
// ==========================================
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
    tab.classList.add("active");
    $("panel-" + tab.dataset.tab).classList.add("active");

    if (tab.dataset.tab === "users") loadUsers();
    if (tab.dataset.tab === "plans") loadPlans();
    if (tab.dataset.tab === "history") loadHistory();
  });
});

document.querySelectorAll(".sub-tab").forEach(st => {
  st.addEventListener("click", () => {
    if (st.classList.contains("danger")) return;
    document.querySelectorAll(".sub-tab").forEach(x => x.classList.remove("active"));
    st.classList.add("active");
    currentHistoryType = st.dataset.htype;
    $("historySearch").value = "";
    renderHistory();
  });
});

// ==========================================
// Users
// ==========================================
const isExpired = u => u.plan_id !== "free" && u.renewal_date && u.renewal_date < todayStr();
const effPlan = u => isExpired(u) ? "free" : u.plan_id;

async function loadUsers() {
  try {
    const d = await apiFetch("/users-list");
    allUsers = d.users || [];
    renderUsers(filterUsers());
    updateStats();
  } catch (e) {
    $("usersList").innerHTML = `<div class="empty">❌ ${esc(e.message)}</div>`;
  }
}

function updateStats() {
  $("statTotal").textContent = allUsers.length;
  ["free", "weekly", "monthly"].forEach(p => {
    const id = "stat" + p[0].toUpperCase() + p.slice(1);
    $(id).textContent = allUsers.filter(u => effPlan(u) === p).length;
  });
}

function filterUsers() {
  const q = $("userSearch").value.trim().toLowerCase();
  if (!q) return allUsers;
  return allUsers.filter(u =>
    (u.username || "").toLowerCase().includes(q) ||
    (u.phone || "").includes(q)
  );
}

function renderUsers(users) {
  const container = $("usersList");
  if (!users.length) {
    container.innerHTML = `<div class="empty">📭 مفيش مستخدمين</div>`;
    return;
  }
  container.innerHTML = "";
  users.forEach(u => {
    const el = document.createElement("div");
    el.className = "card";
    const plan = effPlan(u);
    const lim = u.limit ?? u.plan_limit ?? 0;
    const lis = u.listens_limit ?? u.plan_listens_limit ?? 0;
    const cls = plan === "monthly" ? "monthly" : plan === "weekly" ? "weekly" : "free";

    el.innerHTML = `
      <div class="card-head">
        <div style="flex:1;min-width:0;">
          <div class="card-title">${esc(u.username || "بدون اسم")}</div>
          <div class="card-phone">📱 ${esc(u.phone)}</div>
          <div class="badges">
            <span class="badge ${cls}">${esc(u.plan_name)}</span>
            ${isExpired(u) ? `<span class="badge cancelled">منتهية</span>` : ""}
            ${u.is_cancelled ? `<span class="badge cancelled">ملغي</span>` : ""}
            ${u.upgrade_requested ? `<span class="badge pending">طلب ترقية</span>` : ""}
          </div>
        </div>
        <div class="card-actions">
          <button class="card-btn primary" data-action="edit">✏️ تعديل</button>
        </div>
      </div>
      <div class="meta-row">
        <span>📥 ${u.daily_downloads} / ${lim === -1 ? "∞" : lim}</span>
        <span>🎧 ${u.monthly_listens} / ${lis === -1 ? "∞" : lis}</span>
        ${u.renewal_date ? `<span>📅 ${esc(u.renewal_date)}</span>` : ""}
      </div>`;

    el.querySelector('[data-action="edit"]').addEventListener("click", () => openUserModal(u.phone));
    container.appendChild(el);
  });
}

$("userSearch").addEventListener("input", () => renderUsers(filterUsers()));
$("refreshUsersBtn").addEventListener("click", loadUsers);
$("refreshBtn").addEventListener("click", () => {
  const activeTab = document.querySelector(".tab.active").dataset.tab;
  if (activeTab === "users") loadUsers();
  else if (activeTab === "plans") loadPlans();
  else if (activeTab === "history") loadHistory();
});

// ==========================================
// Plans
// ==========================================
const PLAN_ICONS = { free: "🆓", weekly: "⚡", monthly: "👑" };
const PLATFORM_ICONS = {
  tiktok: "🎵", soundcloud: "☁️", facebook: "📘",
  instagram: "📷", youtube: "▶️", x: "𝕏",
  shahid: "🎬", anghami: "🎧"
};

async function loadPlans() {
  $("plansList").innerHTML = `<div class="loading">جاري التحميل...</div>`;
  try {
    const r = await fetch(SERVER_URL + "/get-plans");
    const d = await r.json();
    if (!r.ok || !d.success) throw new Error(d.error || "فشل");
    allPlans = d.plans || {};
    renderPlans(allPlans);
  } catch (e) {
    $("plansList").innerHTML = `<div class="empty">❌ ${esc(e.message)}</div>`;
  }
}

function renderPlans(plans) {
  const container = $("plansList");
  const order = ["free", "weekly", "monthly"];
  const list = order.filter(p => plans[p]).map(p => ({ id: p, ...plans[p] }));

  if (!list.length) {
    container.innerHTML = `<div class="empty">📭 مفيش باقات</div>`;
    return;
  }

  container.innerHTML = "";
  list.forEach(p => {
    const el = document.createElement("div");
    el.className = "plan-card" + (p.id === "monthly" ? " featured" : "");

    const price = p.price === 0 ? "مجاناً" : p.price + " ج";
    const duration = p.duration_label || "";
    const icon = PLAN_ICONS[p.id] || "💎";

    const platformsList = p.all_platforms
      ? `<span class="platform-chip all">🌍 جميع المنصات</span>`
      : (p.platforms || []).map(pl =>
          `<span class="platform-chip">${PLATFORM_ICONS[pl] || "🌐"} ${esc(pl)}</span>`
        ).join("");

    el.innerHTML = `
      <div class="plan-head">
        <div class="plan-icon ${p.id}">${icon}</div>
        <div class="plan-price">
          <span class="amount">${price}</span>
          <span class="label">${duration}</span>
        </div>
      </div>
      <div class="plan-name">${esc(p.name)}</div>
      <div class="plan-desc">
        ${p.limit === -1 ? "تحميلات غير محدودة" : `${p.limit} تحميل يومياً`} •
        ${p.listens_limit === -1 ? "استماع غير محدود" : `${p.listens_limit} استماع شهرياً`}
      </div>
      <ul class="plan-features">
        <li>${p.limit === -1 ? "تحميلات غير محدودة (Unlimited)" : `${p.limit} تحميل يومياً`}</li>
        <li>${p.listens_limit === -1 ? "استماع غير محدود" : `${p.listens_limit} استماع شهرياً`}</li>
        <li>${p.all_platforms ? "التحميل من أي موقع في العالم" : "منصات محددة"}</li>
        <li>${p.duration_days > 0 ? `${p.duration_days} يوم صلاحية` : "بدون تاريخ انتهاء"}</li>
      </ul>
      <div class="plan-platforms">
        <div class="plan-platforms-label">المنصات المدعومة</div>
        <div class="plan-platforms-list">${platformsList}</div>
      </div>
    `;
    container.appendChild(el);
  });
}

// ==========================================
// History
// ==========================================
async function loadHistory() {
  $("historyList").innerHTML = `<div class="loading">جاري التحميل...</div>`;
  try {
    const d = await apiFetch("/history?type=all&limit=500");
    allHistory = Object.assign({ links: [], otp: [], login: [] }, d.data || {});
    renderHistory();
  } catch (e) {
    $("historyList").innerHTML = `<div class="empty">❌ ${esc(e.message)}</div>`;
  }
}

const LOGIN_ACTIONS = {
  admin_login: "🔑 دخول أدمن",
  otp_login: "📱 دخول مستخدم",
  signup: "🆕 تسجيل جديد",
  logout: "🚪 خروج"
};
const ADMIN_ACTIONS = {
  set_plan: "تغيير باقة",
  delete_user: "حذف مستخدم",
  set_counters: "تعديل عدادات",
  set_listen_limit: "تعديل حد الاستماع",
  clear_history: "مسح السجل",
  delete_file: "حذف ملف"
};

function renderHistory(list = allHistory[currentHistoryType] || []) {
  const container = $("historyList");
  if (!list.length) {
    container.innerHTML = `<div class="empty">📭 مفيش سجل</div>`;
    return;
  }
  container.innerHTML = "";
  const t = currentHistoryType;

  list.forEach(item => {
    const ok = item.status === "success";
    const st = ok ? ["success", "نجح"]
             : item.status === "quota" ? ["quota", "حد أقصى"]
             : ["failed", "فشل"];
    let title = "", phone = "", badges = "", lines = "";

    if (t === "links") {
      title = esc(item.username || "مجهول");
      phone = item.phone || "—";
      badges = `<span class="badge ${item.action === "stream" ? "stream" : "download"}">${item.action === "stream" ? "🎧 استماع" : "⬇️ تحميل"}</span>`;
      lines += `<span style="word-break:break-all;direction:ltr;text-align:right;color:#c4b5fd;font-size:10.5px;">${esc((item.url || "").slice(0, 80))}</span>`;
      if (item.error === "cache") badges += `<span class="badge cache">⚡ من الكاش</span>`;
      else if (item.error) lines += `<span style="color:#fca5a5;">⚠️ ${esc(item.error)}</span>`;
    } else if (t === "otp") {
      title = "📱 " + esc(item.phone || "—");
      badges = `<span class="badge video">${item.action === "send" ? "📤 إرسال" : "✅ تحقق"}</span>`;
      if (item.error) lines += `<span style="color:#fca5a5;">⚠️ ${esc(item.error)}</span>`;
    } else {
      const raw = String(item.action || "");
      const base = raw.split(":")[0];
      const isAdminAction = raw.includes(":") && ADMIN_ACTIONS[base];
      title = esc(item.username || "—");
      phone = item.phone || "—";
      badges = `<span class="badge free">${isAdminAction ? "🛠️ " + ADMIN_ACTIONS[base] : (LOGIN_ACTIONS[raw] || esc(raw))}</span>`;
      if (isAdminAction) lines += `<span style="direction:ltr;text-align:right;color:#c4b5fd;font-size:10.5px;">${esc(raw.slice(base.length + 1))}</span>`;
      if (item.error) lines += `<span style="color:#fca5a5;">⚠️ ${esc(item.error)}</span>`;
    }

    const el = document.createElement("div");
    el.className = "card";
    el.innerHTML = `
      <div class="card-head">
        <div style="flex:1;min-width:0;">
          <div class="card-title">${title}</div>
          ${phone ? `<div class="card-phone">📱 ${esc(phone)}</div>` : ""}
          <div class="badges">
            ${badges}
            <span class="badge ${st[0]}">${st[1]}</span>
          </div>
        </div>
      </div>
      <div class="meta-row" style="flex-direction:column;gap:5px;">
        ${lines}
        <span>🕐 ${esc(item.timestamp || "—")}${item.ip ? " · 🌐 " + esc(item.ip) : ""}</span>
      </div>`;
    container.appendChild(el);
  });
}

$("refreshHistoryBtn").addEventListener("click", loadHistory);
$("historySearch").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  const list = allHistory[currentHistoryType] || [];
  renderHistory(q ? list.filter(i => JSON.stringify(i).toLowerCase().includes(q)) : list);
});

// زر مسح السجل
(function addClearBtn() {
  const b = document.createElement("button");
  b.className = "sub-tab danger";
  b.textContent = "🗑️ مسح السجل";
  b.addEventListener("click", async () => {
    if (!confirm("مسح سجل هذا القسم نهائياً؟")) return;
    try {
      await apiFetch("/history/clear", {
        method: "POST",
        body: JSON.stringify({ type: currentHistoryType })
      });
      showToast("✅ تم مسح السجل");
      loadHistory();
    } catch (e) {
      showToast("❌ " + e.message, "err");
    }
  });
  document.querySelector(".sub-tabs").appendChild(b);
})();

// ==========================================
// User Modal
// ==========================================
async function openUserModal(phone) {
  $("userModal").classList.add("active");
  $("userModalTitle").textContent = "جاري التحميل...";
  $("userModalPhone").textContent = "";
  $("userModalMeta").innerHTML = "";
  try {
    const d = await apiFetch("/user/" + encodeURIComponent(phone));
    currentEditingUser = d.user;
    if (!Object.keys(allPlans).length) await loadPlans();
    renderUserModal(d.user);
  } catch (e) {
    $("userModalTitle").textContent = "خطأ";
    $("userModalPhone").textContent = e.message;
  }
}

function renderUserModal(u) {
  $("userModalTitle").textContent = u.username || "مستخدم";
  $("userModalPhone").textContent = "📱 " + u.phone;
  const meta = [];
  if (u.created_at) meta.push(`🗓️ ${esc(u.created_at)}`);
  if (u.last_login) meta.push(`🔐 ${esc(u.last_login)}`);
  $("userModalMeta").innerHTML = meta.map(p => `<span>${p}</span>`).join("");

  $("newPlanSelect").innerHTML = Object.keys(allPlans).map(pid =>
    `<option value="${esc(pid)}" ${pid === u.plan_id ? "selected" : ""}>${esc(allPlans[pid].name)}</option>`
  ).join("");

  $("downloadsInput").value = u.daily_downloads || 0;
  $("listensInput").value = u.monthly_listens || 0;
  $("renewalDateInput").value = u.renewal_date || "";
  $("customListenInput").value = "";
}

$("saveUserBtn").addEventListener("click", async () => {
  if (!currentEditingUser) return;
  const btn = $("saveUserBtn");
  btn.textContent = "جاري الحفظ...";
  btn.disabled = true;
  try {
    const phone = encodeURIComponent(currentEditingUser.phone);
    const newPlan = $("newPlanSelect").value;
    const planChanged = newPlan !== currentEditingUser.plan_id;

    if (planChanged) {
      await apiFetch(`/user/${phone}/set-plan`, {
        method: "POST",
        body: JSON.stringify({ plan: newPlan })
      });
    }

    const body = {
      daily_downloads: parseInt($("downloadsInput").value) || 0,
      monthly_listens: parseInt($("listensInput").value) || 0
    };
    const dateVal = $("renewalDateInput").value || "";
    const dateEdited = dateVal !== (currentEditingUser.renewal_date || "");
    if (!planChanged || dateEdited) body.renewal_date = dateVal;

    const custom = parseInt($("customListenInput").value);
    if (!Number.isNaN(custom)) body.listens_limit = custom;

    await apiFetch(`/user/${phone}/set-counters`, {
      method: "POST",
      body: JSON.stringify(body)
    });

    showToast("✅ تم حفظ التغييرات");
    closeUserModal();
    loadUsers();
  } catch (e) {
    showToast("❌ " + e.message, "err");
  } finally {
    btn.textContent = "💾 حفظ التغييرات";
    btn.disabled = false;
  }
});

$("deleteUserBtn").addEventListener("click", async () => {
  if (!currentEditingUser) return;
  const u = currentEditingUser;
  if (!confirm(`هل أنت متأكد من حذف المستخدم "${u.username || u.phone}"؟`)) return;
  const btn = $("deleteUserBtn");
  btn.textContent = "جاري الحذف...";
  btn.disabled = true;
  try {
    await apiFetch(`/user/${encodeURIComponent(u.phone)}`, { method: "DELETE" });
    showToast("✅ تم حذف المستخدم");
    closeUserModal();
    loadUsers();
  } catch (e) {
    showToast("❌ " + e.message, "err");
  } finally {
    btn.textContent = "🗑️ حذف";
    btn.disabled = false;
  }
});

function closeUserModal() {
  $("userModal").classList.remove("active");
  currentEditingUser = null;
}
$("userModal").addEventListener("click", e => {
  if (e.target.id === "userModal") closeUserModal();
});

// ==========================================
// Video Modal
// ==========================================
function closeVideoModal() {
  $("videoModal").classList.remove("active");
  $("videoPlayerSlot").innerHTML = "";
}
$("videoModal").addEventListener("click", e => {
  if (e.target.id === "videoModal") closeVideoModal();
});

// ==========================================
// Auto refresh
// ==========================================
function startRefresh() {
  stopRefresh();
  refreshTimer = setInterval(() => {
    if (document.hidden || !adminToken) return;
    if (document.querySelector('.tab[data-tab="users"].active')) loadUsers();
  }, 30000);
}
function stopRefresh() {
  if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
}

// ==========================================
// Dashboard Start
// ==========================================
function startDashboard() {
  loadPlans();
  loadUsers();
  startRefresh();
}

// ==========================================
// Init
// ==========================================
(async function init() {
  if (await checkAuth()) {
    hideLoginScreen();
    $("welcomeText").textContent = "مرحباً " + adminUsername;
    startDashboard();
  } else {
    showLoginScreen();
  }
})();
</script>
