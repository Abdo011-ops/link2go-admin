<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Link2Go — لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#08070d;--bg-2:#0d0c15;
  --surface:rgba(22,20,35,.72);
  --surface-2:rgba(30,27,48,.85);
  --border:rgba(168,132,255,.14);
  --border-2:rgba(168,132,255,.28);
  --text:#f5f3ff;--muted:#a09db8;--muted-2:#6b6885;
  --accent:#a855f7;--accent-2:#7c3aed;--accent-3:#c084fc;
  --success:#10b981;--danger:#ef4444;--warning:#f59e0b;--info:#3b82f6;
  --glow:0 0 40px rgba(168,85,247,.3);
}
body{
  font-family:'Cairo',system-ui,sans-serif;
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%,rgba(168,85,247,.18),transparent),
    radial-gradient(ellipse 60% 40% at 80% 100%,rgba(124,58,237,.12),transparent),
    linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 100%);
  background-attachment:fixed;color:var(--text);
  min-height:100vh;overflow-x:hidden;
}
.toast{
  position:fixed;top:24px;left:50%;transform:translate(-50%,-120%);
  padding:13px 24px;border-radius:13px;
  background:rgba(22,20,35,.97);border:1px solid var(--border-2);
  backdrop-filter:blur(20px);font-size:13px;font-weight:700;
  z-index:9999;transition:transform .4s cubic-bezier(.16,1,.3,1);
  box-shadow:0 20px 60px rgba(0,0,0,.5);max-width:90vw;
}
.toast.show{transform:translate(-50%,0);}
.toast.ok{border-color:rgba(16,185,129,.4);color:#6ee7b7;}
.toast.err{border-color:rgba(239,68,68,.4);color:#fca5a5;}

/* Login */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;z-index:1;}
#loginScreen.hidden{display:none;}
.login-card{
  width:100%;max-width:400px;
  background:linear-gradient(145deg,rgba(30,27,48,.9),rgba(20,18,32,.95));
  border:1px solid var(--border-2);border-radius:24px;padding:42px 32px;
  position:relative;overflow:hidden;
  box-shadow:0 30px 90px rgba(0,0,0,.7),var(--glow);
  animation:cardIn .6s cubic-bezier(.16,1,.3,1);
}
@keyframes cardIn{from{opacity:0;transform:translateY(20px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
.login-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,transparent,var(--accent),var(--accent-3),transparent);
  background-size:200% 100%;animation:shine 3s linear infinite;
}
@keyframes shine{to{background-position:200% center;}}
.login-logo{
  width:72px;height:72px;border-radius:20px;margin:0 auto 20px;
  display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  box-shadow:0 15px 40px rgba(168,85,247,.5);font-size:32px;
}
.login-card h2{font-size:24px;font-weight:800;text-align:center;margin-bottom:6px;
  background:linear-gradient(135deg,#fff,var(--accent-3));
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.login-card p{text-align:center;color:var(--muted);font-size:13px;margin-bottom:28px;}

.input-group{margin-bottom:16px;text-align:right;}
.input-group label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px;}
.input-group input{
  width:100%;padding:14px 16px;border-radius:12px;
  background:rgba(10,9,16,.6);border:1px solid var(--border);
  color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.25s;
}
.input-group input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(168,85,247,.12);}

.btn-primary{
  width:100%;padding:14px;border-radius:13px;border:0;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;font-family:inherit;font-size:15px;font-weight:800;
  cursor:pointer;transition:.25s;
  box-shadow:0 12px 35px rgba(168,85,247,.35);margin-top:8px;
}
.btn-primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 17px 45px rgba(168,85,247,.5);}
.btn-primary:disabled{opacity:.6;cursor:wait;}

.login-msg{display:none;margin-top:14px;padding:11px 14px;border-radius:11px;font-size:12.5px;text-align:center;font-weight:600;}
.login-msg.show{display:block;}
.login-msg.err{background:rgba(239,68,68,.1);color:#fca5a5;border:1px solid rgba(239,68,68,.25);}

/* Main */
#mainPanel{display:none;position:relative;z-index:1;}
#mainPanel.show{display:block;}
.wrap{width:min(1240px,94%);margin:0 auto;padding:28px 0 80px;}

.app-header{
  display:flex;justify-content:space-between;align-items:center;
  padding:20px 0 24px;border-bottom:1px solid var(--border);
  margin-bottom:28px;flex-wrap:wrap;gap:14px;
}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;}
.brand-icon{
  width:44px;height:44px;border-radius:13px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:grid;place-items:center;
  box-shadow:0 10px 30px rgba(168,85,247,.4);font-size:22px;
}
.brand-text strong{display:block;font-size:17px;font-weight:900;}
.brand-text span{display:block;color:var(--muted);font-size:11.5px;margin-top:2px;}

.header-actions{display:flex;gap:10px;flex-wrap:wrap;}
.icon-btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 16px;border-radius:11px;
  background:var(--surface);border:1px solid var(--border);
  color:var(--text);font-family:inherit;font-size:12.5px;font-weight:700;
  cursor:pointer;transition:.25s;text-decoration:none;
}
.icon-btn:hover{background:var(--surface-2);border-color:var(--border-2);transform:translateY(-1px);}
.icon-btn.danger:hover{border-color:rgba(239,68,68,.5);color:#fca5a5;}
.icon-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}

/* Tabs */
.tabs{
  display:flex;gap:6px;margin-bottom:24px;
  background:var(--surface);padding:6px;border-radius:16px;
  border:1px solid var(--border);
  width:fit-content;max-width:100%;overflow-x:auto;
}
.tabs::-webkit-scrollbar{display:none;}
.tab{
  padding:11px 20px;border-radius:11px;border:0;
  background:transparent;color:var(--muted);
  font-family:inherit;font-size:13.5px;font-weight:700;
  cursor:pointer;transition:.25s;
  display:inline-flex;align-items:center;gap:8px;white-space:nowrap;
}
.tab:hover{color:var(--text);}
.tab.active{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 10px 30px rgba(168,85,247,.4);}
.tab svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
.tab .badge-mini{
  font-size:10px;padding:2px 7px;border-radius:100px;
  background:rgba(255,255,255,.15);font-weight:800;
}
.tab.active .badge-mini{background:rgba(255,255,255,.3);}

.panel{display:none;}
.panel.active{display:block;animation:panelIn .4s cubic-bezier(.16,1,.3,1);}
@keyframes panelIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px;}
.stat{
  background:linear-gradient(145deg,rgba(30,27,48,.7),rgba(20,18,32,.85));
  border:1px solid var(--border);border-radius:16px;padding:20px;
  position:relative;overflow:hidden;transition:.3s;
}
.stat:hover{border-color:var(--border-2);transform:translateY(-3px);box-shadow:0 20px 50px rgba(0,0,0,.4);}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent-3));opacity:.6;}
.stat.blue::before{background:linear-gradient(90deg,#3b82f6,#60a5fa);}
.stat.green::before{background:linear-gradient(90deg,#10b981,#34d399);}
.stat.gold::before{background:linear-gradient(90deg,#f59e0b,#fbbf24);}
.stat.red::before{background:linear-gradient(90deg,#ef4444,#f87171);}
.stat-icon{width:38px;height:38px;border-radius:11px;background:rgba(168,85,247,.15);display:grid;place-items:center;margin-bottom:12px;font-size:18px;}
.stat.blue .stat-icon{background:rgba(59,130,246,.15);}
.stat.green .stat-icon{background:rgba(16,185,129,.15);}
.stat.gold .stat-icon{background:rgba(245,158,11,.15);}
.stat.red .stat-icon{background:rgba(239,68,68,.15);}
.stat-label{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px;}
.stat-value{font-size:26px;font-weight:900;letter-spacing:-.5px;line-height:1;}
.stat.blue .stat-value{color:#60a5fa;}
.stat.green .stat-value{color:#34d399;}
.stat.gold .stat-value{color:#fbbf24;}
.stat.red .stat-value{color:#f87171;}

/* Search bar */
.search-bar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.search-bar input{
  flex:1;min-width:220px;padding:13px 18px;border-radius:12px;
  background:var(--surface);border:1px solid var(--border);
  color:var(--text);font-family:inherit;font-size:13.5px;outline:none;transition:.25s;
}
.search-bar input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(168,85,247,.12);}
.search-bar button{
  padding:13px 22px;border-radius:12px;border:0;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;font-family:inherit;font-size:13px;font-weight:800;
  cursor:pointer;transition:.25s;box-shadow:0 10px 30px rgba(168,85,247,.3);
}
.search-bar button:hover{transform:translateY(-2px);}

/* Cards */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;}
.card{
  background:linear-gradient(145deg,rgba(30,27,48,.65),rgba(20,18,32,.85));
  border:1px solid var(--border);border-radius:16px;padding:18px;
  transition:.3s;position:relative;overflow:hidden;
}
.card:hover{border-color:var(--border-2);transform:translateY(-3px);box-shadow:0 25px 60px rgba(0,0,0,.5);}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
.card-title{font-size:15px;font-weight:800;margin-bottom:4px;word-break:break-word;}
.card-phone{font-size:12.5px;color:var(--accent-3);direction:ltr;text-align:right;font-weight:600;}

.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;}
.badge{
  display:inline-flex;align-items:center;gap:4px;padding:4px 10px;
  border-radius:100px;font-size:10.5px;font-weight:800;
}
.badge.free{background:rgba(148,163,184,.15);color:#cbd5e1;}
.badge.weekly{background:rgba(59,130,246,.2);color:#93c5fd;}
.badge.monthly{background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#000;}
.badge.success{background:rgba(16,185,129,.18);color:#6ee7b7;}
.badge.failed{background:rgba(239,68,68,.18);color:#fca5a5;}
.badge.quota{background:rgba(245,158,11,.18);color:#fcd34d;}
.badge.cancelled{background:rgba(239,68,68,.15);color:#fca5a5;}
.badge.pending{background:rgba(245,158,11,.15);color:#fcd34d;}
.badge.stream{background:rgba(168,85,247,.2);color:#d8b4fe;}
.badge.download{background:rgba(59,130,246,.2);color:#93c5fd;}
.badge.video{background:rgba(59,130,246,.15);color:#93c5fd;}
.badge.cache{background:rgba(16,185,129,.2);color:#6ee7b7;}
.badge.high{background:rgba(239,68,68,.25);color:#fca5a5;}
.badge.medium{background:rgba(245,158,11,.2);color:#fcd34d;}
.badge.low{background:rgba(59,130,246,.2);color:#93c5fd;}
.badge.critical{background:rgba(239,68,68,.4);color:#fff;animation:pulse-red 1.5s infinite;}
@keyframes pulse-red{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.5);}50%{box-shadow:0 0 0 6px rgba(239,68,68,0);}}

.meta-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;padding-top:12px;border-top:1px dashed rgba(168,132,255,.12);font-size:11.5px;color:var(--muted);font-weight:600;}
.meta-row span{display:inline-flex;align-items:center;gap:5px;}

.card-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
.card-btn{
  padding:8px 14px;border-radius:9px;
  background:rgba(168,85,247,.1);border:1px solid var(--border);
  color:var(--text);font-family:inherit;font-size:12px;font-weight:700;
  cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:6px;text-decoration:none;
}
.card-btn:hover{background:var(--surface-2);border-color:var(--border-2);}
.card-btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border-color:transparent;color:#fff;box-shadow:0 8px 25px rgba(168,85,247,.35);}
.card-btn.primary:hover{box-shadow:0 12px 35px rgba(168,85,247,.5);}
.card-btn.danger{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3);color:#fca5a5;}
.card-btn.danger:hover{background:rgba(239,68,68,.25);color:#fff;}
.card-btn.success{background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.3);color:#6ee7b7;}
.card-btn.success:hover{background:rgba(16,185,129,.25);color:#fff;}
.card-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.4;}

.empty,.loading{grid-column:1/-1;padding:60px 20px;text-align:center;color:var(--muted);font-size:13.5px;font-weight:600;}
.loading::before{content:'';display:block;width:36px;height:36px;margin:0 auto 16px;border:3px solid rgba(168,85,247,.2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* Sub tabs */
.sub-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.sub-tab{padding:8px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--border);color:var(--muted);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:.2s;}
.sub-tab:hover{color:var(--text);border-color:var(--border-2);}
.sub-tab.active{background:rgba(168,85,247,.15);border-color:rgba(168,132,255,.4);color:var(--accent-3);}

/* Plans Grid */
.plans-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin-bottom:24px;}
.plan-card{
  background:linear-gradient(145deg,rgba(30,27,48,.75),rgba(20,18,32,.9));
  border:1px solid var(--border);border-radius:20px;padding:26px;
  position:relative;overflow:hidden;transition:.3s;
  display:flex;flex-direction:column;
}
.plan-card:hover{transform:translateY(-5px);border-color:var(--border-2);box-shadow:0 30px 70px rgba(0,0,0,.5);}
.plan-card.featured{
  border-color:rgba(245,158,11,.5);
  background:linear-gradient(145deg,rgba(50,40,25,.85),rgba(30,22,15,.95));
  box-shadow:0 20px 60px rgba(245,158,11,.2);
}
.plan-card.featured::before{
  content:'⭐ الأكثر طلباً';
  position:absolute;top:14px;left:14px;
  padding:5px 12px;border-radius:100px;
  background:linear-gradient(135deg,#f59e0b,#fbbf24);
  color:#000;font-size:10.5px;font-weight:800;
  box-shadow:0 6px 20px rgba(245,158,11,.5);
}
.plan-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;}
.plan-icon{
  width:52px;height:52px;border-radius:14px;
  display:grid;place-items:center;font-size:24px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  box-shadow:0 10px 30px rgba(168,85,247,.35);
}
.plan-icon.free{background:linear-gradient(135deg,#64748b,#94a3b8);box-shadow:0 10px 30px rgba(100,116,139,.3);}
.plan-icon.weekly{background:linear-gradient(135deg,#3b82f6,#60a5fa);box-shadow:0 10px 30px rgba(59,130,246,.35);}
.plan-icon.monthly{background:linear-gradient(135deg,#f59e0b,#fbbf24);box-shadow:0 10px 30px rgba(245,158,11,.4);color:#000;}
.plan-price{text-align:left;}
.plan-price .amount{font-size:30px;font-weight:900;letter-spacing:-1px;line-height:1;display:block;}
.plan-price .label{font-size:11.5px;color:var(--muted);margin-top:4px;display:block;font-weight:600;}
.plan-name{font-size:18px;font-weight:900;margin-bottom:6px;letter-spacing:-.3px;}
.plan-desc{font-size:12.5px;color:var(--muted);margin-bottom:18px;line-height:1.6;}
.plan-features{list-style:none;display:flex;flex-direction:column;gap:10px;flex:1;}
.plan-features li{display:flex;align-items:flex-start;gap:9px;font-size:12.5px;color:#d5d2e8;line-height:1.5;font-weight:500;}
.plan-features li::before{
  content:'✓';flex-shrink:0;width:18px;height:18px;
  border-radius:50%;background:rgba(16,185,129,.15);color:#6ee7b7;
  display:grid;place-items:center;font-size:11px;font-weight:900;margin-top:1px;
}
.plan-platforms{margin-top:16px;padding-top:16px;border-top:1px dashed rgba(168,132,255,.15);}
.plan-platforms-label{font-size:10.5px;color:var(--muted);font-weight:700;margin-bottom:8px;letter-spacing:.5px;}
.plan-platforms-list{display:flex;gap:6px;flex-wrap:wrap;}
.platform-chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 10px;border-radius:100px;
  background:rgba(168,85,247,.1);border:1px solid rgba(168,132,255,.18);
  font-size:10.5px;font-weight:700;color:#d8b4fe;
}
.platform-chip.all{
  background:linear-gradient(135deg,rgba(245,158,11,.2),rgba(251,191,36,.15));
  border-color:rgba(245,158,11,.4);color:#fbbf24;
}

/* Modal */
.modal{position:fixed;inset:0;z-index:2000;background:rgba(5,4,10,.85);backdrop-filter:blur(15px);display:none;align-items:center;justify-content:center;padding:20px;}
.modal.active{display:flex;animation:fadeIn .3s;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal-content{
  width:100%;max-width:540px;
  background:linear-gradient(145deg,rgba(30,27,48,.98),rgba(20,18,32,.99));
  border:1px solid var(--border-2);border-radius:22px;padding:28px;
  max-height:92vh;overflow-y:auto;position:relative;
  box-shadow:0 40px 100px rgba(0,0,0,.8),var(--glow);
  animation:modalIn .45s cubic-bezier(.16,1,.3,1);
}
@keyframes modalIn{from{opacity:0;transform:scale(.92) translateY(20px);}to{opacity:1;transform:scale(1) translateY(0);}}
.modal-content::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--accent),var(--accent-3),transparent);background-size:200% 100%;animation:shine 3s linear infinite;}
.modal-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;gap:12px;}
.modal-header h3{font-size:18px;font-weight:900;background:linear-gradient(135deg,#fff,var(--accent-3));-webkit-background-clip:text;background-clip:text;color:transparent;}
.close-btn{width:34px;height:34px;border-radius:10px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);color:#fca5a5;cursor:pointer;transition:.2s;display:grid;place-items:center;flex-shrink:0;font-size:18px;}
.close-btn:hover{background:rgba(239,68,68,.25);color:#fff;transform:rotate(90deg);}

.field{margin-bottom:14px;text-align:right;}
.field label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px;}
.field input,.field select{width:100%;padding:12px 14px;border-radius:11px;background:rgba(10,9,16,.7);border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:13.5px;outline:none;transition:.25s;}
.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(168,85,247,.12);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

.modal-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;}
.btn{padding:12px 20px;border-radius:12px;border:0;font-family:inherit;font-size:13.5px;font-weight:800;cursor:pointer;transition:.25s;display:inline-flex;align-items:center;justify-content:center;gap:7px;}
.btn.primary{flex:1;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 10px 30px rgba(168,85,247,.35);}
.btn.primary:hover{transform:translateY(-2px);}
.btn.danger{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#fca5a5;}
.btn.danger:hover{background:rgba(239,68,68,.25);color:#fff;}

@media(max-width:700px){
  .wrap{padding:20px 0 60px;}
  .app-header{padding:14px 0 18px;}
  .brand-text strong{font-size:15px;}
  .stats{grid-template-columns:repeat(2,1fr);}
  .stat{padding:16px;}

}

/* ============ Toast ============ */
let toastTimer;
function toast(msg, type='ok'){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 3000);
}

/* ============ Login ============ */
const AUTH = {user:'admin', pass:'admin123'};
function isLoggedIn(){ return DB.get('session', false) === true; }

function doLogin(){
  const u = document.getElementById('usernameInput').value.trim();
  const p = document.getElementById('passwordInput').value;
  const btn = document.getElementById('loginBtn');
  const msg = document.getElementById('loginMsg');

  msg.className = 'login-msg';
  if(!u || !p){ msg.className='login-msg show err'; msg.textContent='اكتب اسم المستخدم وكلمة المرور'; return; }

  btn.disabled = true; btn.textContent = 'جاري التحقق...';
  setTimeout(()=>{
    if(u === AUTH.user && p === AUTH.pass){
      DB.set('session', true);
      showMain();
      toast('مرحباً بك 👋');
    } else {
      msg.className = 'login-msg show err';
      msg.textContent = 'بيانات الدخول غير صحيحة';
      btn.disabled = false; btn.textContent = 'تسجيل الدخول';
    }
  }, 500);
}

function doLogout(){
  DB.set('session', false);
  document.getElementById('mainPanel').classList.remove('show');
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('passwordInput').value = '';
  toast('تم تسجيل الخروج');
}

function showMain(){
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('mainPanel').classList.add('show');
  document.getElementById('welcomeText').textContent = 'مرحباً، ' + AUTH.user;
  renderAll();
}

/* ============ Tabs ============ */
document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    tab.classList.add('active');
    const target = document.getElementById('panel-'+tab.dataset.tab);
    if(target) target.classList.add('active');
    renderAll();
  });
});

/* ============ Renderers ============ */
function renderAll(){
  renderUsers();
  renderPlans();
  renderHistory();
  renderSecurity();
  renderCloud();
}

/* Users */
let userFilter = 'all';
function renderUsers(){
  const users = DB.get('users', []);
  const search = (document.getElementById('usersSearch')?.value || '').toLowerCase();

  const stats = document.getElementById('usersStats');
  if(stats){
    const total = users.length;
    const monthly = users.filter(u=>u.plan==='monthly').length;
    const weekly = users.filter(u=>u.plan==='weekly').length;
    const free = users.filter(u=>u.plan==='free').length;
    stats.innerHTML = `
      <div class="stat"><div class="stat-icon">👥</div><div class="stat-label">إجمالي المستخدمين</div><div class="stat-value">${total}</div></div>
      <div class="stat gold"><div class="stat-icon">💎</div><div class="stat-label">باقة شهرية</div><div class="stat-value">${monthly}</div></div>
      <div class="stat blue"><div class="stat-icon">📅</div><div class="stat-label">باقة أسبوعية</div><div class="stat-value">${weekly}</div></div>
      <div class="stat green"><div class="stat-icon">🆓</div><div class="stat-label">باقة مجانية</div><div class="stat-value">${free}</div></div>
    `;
  }

  const list = document.getElementById('usersList');
  if(!list) return;

  const filtered = users.filter(u =>
    u.name.toLowerCase().includes(search) || u.phone.includes(search)
  );

  if(!filtered.length){
    list.innerHTML = '<div class="empty">لا توجد نتائج مطابقة</div>';
    return;
  }

  const planLabel = {free:'مجاني', weekly:'أسبوعي', monthly:'شهري'};
  const statusLabel = {active:'نشط', cancelled:'ملغي', pending:'معلق'};

  list.innerHTML = filtered.map(u=>`
    <div class="card">
      <div class="card-head">
        <div>
          <div class="card-title">${esc(u.name)}</div>
          <div class="card-phone">${esc(u.phone)}</div>
        </div>
        <div class="badges">
          <span class="badge ${u.plan}">${planLabel[u.plan]||u.plan}</span>
          <span class="badge ${u.status==='active'?'success':u.status==='pending'?'pending':'cancelled'}">${statusLabel[u.status]||u.status}</span>
        </div>
      </div>
      <div class="meta-row">
        <span>📊 الاستخدام: ${u.usage}%</span>
        <span>📅 انضم: ${u.joined}</span>
        <span>⏳ ينتهي: ${u.expires}</span>
      </div>
      <div class="card-actions">
        <button class="card-btn primary" onclick="editUser(${u.id})">✏️ تعديل</button>
        <button class="card-btn danger" onclick="deleteUser(${u.id})">🗑️ حذف</button>
      </div>
    </div>
  `).join('');
}

/* Plans */
function renderPlans(){
  const grid = document.getElementById('plansGrid');
  if(!grid) return;
  const plans = [
    {name:'المجاني', icon:'🆓', cls:'free', price:'0', label:'للأبد', desc:'جرّب الخدمة بدون أي التزام', featured:false,

    {name:'الأسبوعي', icon:'⚡', cls:'weekly', price:'29', label:'ج.م / أسبوع', desc:'للمستخدمين المتوسطين', featured:false,
     features:['بث بجودة 1080p','تحميل غير محدود','بدون إعلانات','دعم أولوية','كاش أسرع'],

        </div>

/* History */
let historyFilter = 'all';
document.getElementById('historyFilters')?.addEventListener('click', e=>{
  const btn = e.target.closest('.sub-tab');
  if(!btn) return;
  document.querySelectorAll('#historyFilters .sub-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  historyFilter = btn.dataset.filter;
  renderHistory();
});

function renderHistory(){
  const list = document.getElementById('historyList');
  if(!list) return;
  let items = DB.get('history', []);

  if(historyFilter !== 'all'){
    if(historyFilter === 'success' || historyFilter === 'failed'){
      items = items.filter(i=> i.status === historyFilter);
    } else {
      items = items.filter(i=> i.type === historyFilter);
    }
  }

  if(!items.length){ list.innerHTML = '<div class="empty">لا توجد سجلات</div>'; return; }

  const typeLabel = {stream:'بث مباشر', download:'تحميل'};
  const statusLabel = {success:'ناجح', failed:'فاشل', quota:'تجاوز الحد'};

  list.innerHTML = items.map(i=>`
    <div class="card">
      <div class="card-head">
        <div>
          <div class="card-title">${esc(i.user)}</div>
          <div class="card-phone" style="font-size:11px;direction:ltr;text-align:right;opacity:.7;">${esc(i.url)}</div>
        </div>
        <div class="badges">
          <span class="badge ${i.type==='stream'?'stream':'download'}">${typeLabel[i.type]||i.type}</span>
          <span class="badge ${i.status==='success'?'success':i.status==='failed'?'failed':'quota'}">${statusLabel[i.status]||i.status}</span>
        </div>
      </div>
      <div class="meta-row">
        <span>📦 ${i.size}</span>
        <span>🕐 ${i.date}</span>
      </div>
    </div>
  `).join('');
}

/* Security */
function renderSecurity(){
  const items = DB.get('security', []);
  const stats = document.getElementById('securityStats');
  if(stats){
    const critical = items.filter(i=>i.severity==='critical').length;
    const high = items.filter(i=>i.severity==='high').length;
    const medium = items.filter(i=>i.severity==='medium').length;
    const low = items.filter(i=>i.severity==='low').length;
    stats.innerHTML = `
      <div class="stat red"><div class="stat-icon">🚨</div><div class="stat-label">حرج</div><div class="stat-value">${critical}</div></div>
      <div class="stat gold"><div class="stat-icon">⚠️</div><div class="stat-label">عالي</div><div class="stat-value">${high}</div></div>
      <div class="stat blue"><div class="stat-icon">ℹ️</div><div class="stat-label">متوسط</div><div class="stat-value">${medium}</div></div>
      <div class="stat green"><div class="stat-icon">✅</div><div class="stat-label">منخفض</div><div class="stat-value">${low}</div></div>
    `;
    const badge = document.getElementById('securityBadge');
    if(badge){
      const alerts = critical + high;
      if(alerts > 0){ badge.style.display='inline-block'; badge.textContent = alerts; }
      else badge.style.display='none';
    }
  }

  const list = document.getElementById('securityList');
  if(!list) return;
  if(!items.length){ list.innerHTML = '<div class="empty">لا توجد تنبيهات أمنية</div>'; return; }

  const sevLabel = {critical:'حرج', high:'عالي', medium:'متوسط', low:'منخفض'};
  list.innerHTML = items.map(i=>`
    <div class="card">
      <div class="card-head">
        <div>
          <div class="card-title">${esc(i.type)}</div>
          <div class="card-phone" style="font-size:11px;text-align:right;opacity:.7;">👤 ${esc(i.user)} • 🌐 ${esc(i.ip)}</div>
        </div>
        <div class="badges">
          <span class="badge ${i.severity}">${sevLabel[i.severity]||i.severity}</span>
          <span class="badge ${i.status==='blocked'?'failed':'success'}">${i.status==='blocked'?'محظور':'سليم'}</span>
        </div>
      </div>
      <div class="meta-row"><span>🕐 ${i.date}</span></div>
    </div>
  `).join('');
}

/* Cloud */
function renderCloud(){
  const items = DB.get('cloud', []);
  const stats = document.getElementById('cloudStats');
  if(stats){
    let used = 0, total = 0;
    items.forEach(i=>{
      used += parseFloat(i.used) || 0;
      total += parseFloat(i.total) || 0;
    });
    const pct = total ? Math.round(used/total*100) : 0;
    stats.innerHTML = `
      <div class="stat"><div class="stat-icon">☁️</div><div class="stat-label">إجمالي المساحة المستخدمة</div><div class="stat-value">${used} GB</div></div>
      <div class="stat blue"><div class="stat-icon">💾</div><div class="stat-label">إجمالي المساحة الكلية</div><div class="stat-value">${total} GB</div></div>
      <div class="stat ${pct>75?'red':'green'}"><div class="stat-icon">📊</div><div class="stat-label">نسبة الاستخدام</div><div class="stat-value">${pct}%</div></div>
      <div class="stat gold"><div class="stat-icon">🔗</div><div class="stat-label">عدد المزودين</div><div class="stat-value">${items.length}</div></div>
    `;
  }

  const list = document.getElementById('cloudList');
  if(!list) return;
  if(!items.length){ list.innerHTML = '<div class="empty">لا توجد خدمات سحابية</div>'; return; }

  list.innerHTML = items.map(i=>{
    const used = parseFloat(i.used)||0;
    const total = parseFloat(i.total)||1;
    const pct = Math.round(used/total*100);
    return `
    <div class="card">
      <div class="card-head">
        <div>
          <div class="card-title">${esc(i.name)}</div>
          <div class="card-phone" style="font-size:11px;text-align:right;opacity:.7;">${esc(i.provider)} • ${esc(i.region)}</div>
        </div>
        <div class="badges">
          <span class="badge ${i.status==='warning'?'quota':'cache'}">${i.status==='warning'?'تحذير':'نشط'}</span>
        </div>
      </div>
      <div class="meta-row"><span>📦 ${i.used} / ${i.total}</span><span>📊 ${pct}%</span></div>
    </div>
  `}).join('');
}

/* ============ Modal ============ */
function openModal(title, bodyHtml, actionsHtml){
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('modalActions').innerHTML = actionsHtml;
  document.getElementById('modal').classList.add('active');
}
function closeModal(){
  document.getElementById('modal').classList.remove('active');
}
document.getElementById('modal')?.addEventListener('click', e=>{
  if(e.target.id === 'modal') closeModal();
});

/* ============ User CRUD ============ */
function addUser(){
  openModal('إضافة مستخدم جديد', `
    <div class="field"><label>الاسم</label><input id="mName" type="text" placeholder="اسم المستخدم"></div>
    <div class="field"><label>رقم الهاتف</label><input id="mPhone" type="text" placeholder="+20..." dir="ltr"></div>
    <div class="field-row">
      <div class="field"><label>الباقة</label>
        <select id="mPlan">
          <option value="free">مجاني</option>
          <option value="weekly">أسبوعي</option>
          <option value="monthly">شهري</option>
        </select>
      </div>
      <div class="field"><label>الحالة</label>
        <select id="mStatus">
          <option value="active">نشط</option>
          <option value="pending">معلق</option>
          <option value="cancelled">ملغي</option>
        </select>
      </div>
    </div>
  `, `
    <button class="btn primary" onclick="saveUser()">حفظ</button>
    <button class="btn danger" onclick="closeModal()">إلغاء</button>
  `);
}

function editUser(id){
  const u = DB.get('users', []).find(x=>x.id===id);
  if(!u) return;
  openModal('تعديل المستخدم', `
    <div class="field"><label>الاسم</label><input id="mName" type="text" value="${esc(u.name)}"></div>
    <div class="field"><label>رقم الهاتف</label><input id="mPhone" type="text" value="${esc(u.phone)}" dir="ltr"></div>
    <div class="field-row">
      <div class="field"><label>الباقة</label>
        <select id="mPlan">
          <option value="free" ${u.plan==='free'?'selected':''}>مجاني</option>
          <option value="weekly" ${u.plan==='weekly'?'selected':''}>أسبوعي</option>
          <option value="monthly" ${u.plan==='monthly'?'selected':''}>شهري</option>
        </select>
      </div>
      <div class="field"><label>الحالة</label>
        <select id="mStatus">
          <option value="active" ${u.status==='active'?'selected':''}>نشط</option>
          <option value="pending" ${u.status==='pending'?'selected':''}>معلق</option>
          <option value="cancelled" ${u.status==='cancelled'?'selected':''}>ملغي</option>
        </select>
      </div>
    </div>
    <div class="field"><label>نسبة الاستخدام (%)</label><input id="mUsage" type="number" min="0" max="100" value="${u.usage}"></div>
  `, `
    <button class="btn primary" onclick="saveUser(${id})">حفظ التعديلات</button>
    <button class="btn danger" onclick="closeModal()">إلغاء</button>
  `);
}

function saveUser(id){
  const name = document.getElementById('mName').value.trim();
  const phone = document.getElementById('mPhone').value.trim();
  const plan = document.getElementById('mPlan').value;
  const status = document.getElementById('mStatus').value;
  const usageEl = document.getElementById('mUsage');
  const usage = usageEl ? parseInt(usageEl.value)||0 : 0;

  if(!name || !phone){ toast('الاسم والهاتف مطلوبان', 'err'); return; }

  let users = DB.get('users', []);
  if(id){
    users = users.map(u => u.id===id ? {...u, name, phone, plan, status, usage} : u);
    toast('تم تعديل المستخدم ✅');
  } else {
    const newId = users.length ? Math.max(...users.map(u=>u.id))+1 : 1;
    users.push({id:newId, name, phone, plan, status, usage, joined:new Date().toISOString().slice(0,10), expires:'-'});
    toast('تمت إضافة المستخدم ✅');
  }
  DB.set('users', users);
  closeModal();
  renderUsers();
}

function deleteUser(id){
  const u = DB.get('users', []).find(x=>x.id===id);
  if(!u) return;
  openModal('تأكيد الحذف', `<p style="font-size:13.5px;color:var(--muted);line-height:1.7;">هل أنت متأكد من حذف <strong style="color:var(--text);">${esc(u.name)}</strong>؟ لا يمكن التراجع عن هذه العملية.</p>`, `
    <button class="btn danger" onclick="confirmDeleteUser(${id})">نعم، احذف</button>
    <button class="btn primary" onclick="closeModal()">إلغاء</button>
  `);
}

function confirmDeleteUser(id){
  let users = DB.get('users', []);
  users = users.filter(u=>u.id!==id);
  DB.set('users', users);
  closeModal();
  renderUsers();
  toast('تم حذف المستخدم', 'ok');
}

/* ============ Utils ============ */
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============ Init ============ */
document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('passwordInput').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
document.getElementById('usernameInput').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
document.getElementById('logoutBtn').addEventListener('click', doLogout);
document.getElementById('refreshBtn').addEventListener('click', ()=>{ renderAll(); toast('تم تحديث البيانات'); });
document.getElementById('addUserBtn')?.addEventListener('click', addUser);
document.getElementById('usersSearch')?.addEventListener('input', renderUsers);

seed();
if(isLoggedIn()) showMain();
</script>
