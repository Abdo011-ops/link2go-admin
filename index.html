<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link2Go Admin Panel</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
            --purple: #7c3aed;
            --cyan: #0284c7;
            --gold: #f59e0b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
        
        .hidden { display: none !important; }
        .show { display: flex !important; }

        /* رسائل التنبيه العلوية */
        .msg {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
            background: var(--panel-bg); border: 1px solid var(--border-color); padding: 12px 24px;
            border-radius: 8px; z-index: 1000; transition: transform 0.3s ease; font-weight: bold;
        }
        .msg.show { transform: translateX(-50%) translateY(0); }
        .msg.ok { border-color: var(--success); color: var(--success); }
        .msg.err { border-color: var(--danger); color: var(--danger); }

        /* شاشة تسجيل الدخول */
        #loginScreen {
            flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .login-card {
            background: var(--panel-bg); border: 1px solid var(--border-color); padding: 30px;
            border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .login-card h2 { margin-bottom: 20px; font-size: 24px; text-align: center; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; color: var(--text-muted); font-size: 14px; }
        .form-control {
            width: 100%; background: var(--bg-color); border: 1px solid var(--border-color);
            color: var(--text-main); padding: 12px; border-radius: 8px; font-size: 16px; outline: none;
        }
        .form-control:focus { border-color: var(--primary); }
        .btn {
            width: 100%; background: var(--primary); color: white; border: none; padding: 12px;
            border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s;
        }
        .btn:hover { background: var(--primary-hover); }
        .login-msg { margin-top: 12px; text-align: center; font-size: 14px; display: none; }
        .login-msg.err { color: var(--danger); display: block; }

        /* لوحة التحكم الرئيسية */
        #mainPanel { flex: 1; display: none; flex-direction: column; max-width: 1200px; width: 100%; margin: 0 auto; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; }
        header h1 { font-size: 20px; }
        .user-info { display: flex; align-items: center; gap: 15px; }

        /* التابات */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; flex-wrap: wrap; }
        .tab { background: transparent; border: none; color: var(--text-muted); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 15px; }
        .tab.active { background: var(--primary); color: white; }

        .sub-tabs { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; align-items: center; }
        .sub-tab { background: var(--panel-bg); border: 1px solid var(--border-color); color: var(--text-muted); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .sub-tab.active { border-color: var(--primary); color: var(--text-main); }

        .panel { display: none; }
        .panel.active { display: block; }

        /* الإحصائيات */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: var(--panel-bg); border: 1px solid var(--border-color); padding: 15px; border-radius: 10px; text-align: center; }
        .stat-card h3 { font-size: 14px; color: var(--text-muted); margin-bottom: 5px; }
        .stat-card p { font-size: 22px; font-weight: bold; }

        /* الكروت والقوائم */
        .search-box { width: 100%; margin-bottom: 15px; }
        .grid-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
        .card { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .card-head { display: flex; justify-content: space-between; align-items: flex-start; }
        .card-title { font-weight: bold; font-size: 16px; margin-bottom: 4px; }
        .card-phone { color: var(--text-muted); font-size: 13px; direction: ltr; text-align: right; }
        .meta-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-muted); border-top: 1px solid var(--border-color); padding-top: 8px; flex-wrap: wrap; gap: 6px; }
        
        .badge { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; display: inline-block; }
        .badge.free { background: #334155; color: #cbd5e1; }
        .badge.weekly { background: var(--cyan); color: white; }
        .badge.monthly { background: var(--purple); color: white; }
        .badge.success { background: rgba(34,197,94,0.2); color: var(--success); }
        .badge.failed { background: rgba(239,68,68,0.2); color: var(--danger); }
        .badge.quota { background: rgba(245,158,11,0.2); color: var(--warning); }
        .badge.cancelled { background: rgba(239,68,68,0.2); color: var(--danger); }
        .badge.pending { background: rgba(245,158,11,0.2); color: var(--warning); }

        .card-btn { background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-main); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .card-btn.primary { border-color: var(--primary); color: var(--primary); }
        .card-btn.primary:hover { background: var(--primary); color: white; }
        .card-btn.danger { border-color: var(--danger); color: var(--danger); }
        .card-btn.danger:hover { background: var(--danger); color: white; }

        .empty { text-align: center; color: var(--text-muted); padding: 40px; grid-column: 1 / -1; }
        .loading { text-align: center; color: var(--text-muted); padding: 40px; grid-column: 1 / -1; }

        /* ==========================================
           قسم الباقات - تصميم شيك
           ========================================== */
        .plans-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 18px;
        }

        .plan-card {
            background: linear-gradient(145deg, #1e293b, #182133);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
            overflow: hidden;
        }
        .plan-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            opacity: 0.5;
        }
        .plan-card:hover {
            transform: translateY(-6px);
            border-color: var(--primary);
            box-shadow: 0 20px 40px rgba(0,0,0,0.35);
        }

        /* ألوان الباقات */
        .plan-card.free::before { background: linear-gradient(90deg, transparent, #94a3b8, transparent); }
        .plan-card.free { border-color: #475569; }
        .plan-card.free:hover { border-color: #94a3b8; }

        .plan-card.weekly::before { background: linear-gradient(90deg, transparent, var(--cyan), transparent); }
        .plan-card.weekly { border-color: rgba(2,132,199,0.4); }
        .plan-card.weekly:hover { border-color: var(--cyan); box-shadow: 0 20px 40px rgba(2,132,199,0.2); }

        .plan-card.monthly::before { background: linear-gradient(90deg, transparent, var(--purple), transparent); }
        .plan-card.monthly { border-color: rgba(124,58,237,0.4); }
        .plan-card.monthly:hover { border-color: var(--purple); box-shadow: 0 20px 40px rgba(124,58,237,0.25); }

        .plan-card.guest::before { background: linear-gradient(90deg, transparent, #64748b, transparent); }
        .plan-card.guest { border-color: #334155; opacity: 0.85; }

        .plan-badge-premium {
            position: absolute;
            top: 12px; left: 12px;
            background: linear-gradient(135deg, var(--gold), #d97706);
            color: #000;
            padding: 3px 10px;
            border-radius: 100px;
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 0.3px;
        }

        .plan-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px dashed rgba(255,255,255,0.08);
        }
        .plan-name {
            font-size: 17px;
            font-weight: 800;
            margin-bottom: 4px;
        }
        .plan-card.free .plan-name { color: #cbd5e1; }
        .plan-card.weekly .plan-name { color: #38bdf8; }
        .plan-card.monthly .plan-name { color: #a78bfa; }
        .plan-card.guest .plan-name { color: #94a3b8; }

        .plan-price {
            font-size: 26px;
            font-weight: 900;
            color: #fff;
            display: flex;
            align-items: baseline;
            gap: 4px;
        }
        .plan-price small {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .plan-features {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 9px;
            font-size: 13px;
        }
        .plan-features li {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #cbd5e1;
        }
        .plan-features li.ok::before {
            content: '✓';
            color: var(--success);
            font-weight: 900;
            font-size: 14px;
            width: 16px;
            text-align: center;
            flex-shrink: 0;
        }
        .plan-features li.no {
            color: #64748b;
        }
        .plan-features li.no::before {
            content: '✕';
            color: #475569;
            font-weight: 900;
            font-size: 13px;
            width: 16px;
            text-align: center;
            flex-shrink: 0;
        }

        .plan-platforms-title {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .plan-platforms {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .platform-chip {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 4px 9px;
            border-radius: 6px;
            font-size: 11px;
            color: #cbd5e1;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-weight: 600;
        }
        .platform-chip.unlimited {
            background: linear-gradient(135deg, rgba(124,58,237,0.25), rgba(168,85,247,0.15));
            border-color: rgba(168,85,247,0.4);
            color: #ddd6fe;
        }

        .plan-footer {
            margin-top: auto;
            padding-top: 12px;
            border-top: 1px dashed rgba(255,255,255,0.08);
            font-size: 11px;
            color: var(--text-muted);
            text-align: center;
            font-weight: 600;
        }

        /* المودال (النوافذ المنبثقة) */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 15px; }
        .modal.active { display: flex; }
        .modal-content { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; width: 100%; max-width: 500px; padding: 25px; display: flex; flex-direction: column; gap: 15px; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; }
        .modal-header h3 { font-size: 18px; }
        .close-btn { background: none; border: none; color: var(--text-muted); font-size: 22px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="msg" class="msg"></div>

    <!-- شاشة الدخول -->
    <div id="loginScreen">
        <div class="login-card">
            <h2>تسجيل دخول الأدمن</h2>
            <div class="form-group">
                <label>اسم المستخدم</label>
                <input type="text" id="usernameInput" class="form-control" autocomplete="username">
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="passwordInput" class="form-control" autocomplete="current-password">
            </div>
            <button id="loginBtn" class="btn">تسجيل الدخول</button>
            <div id="loginMsg" class="login-msg"></div>
        </div>
    </div>

    <!-- لوحة التحكم الرئيسية -->
    <div id="mainPanel">
        <header>
            <h1 id="welcomeText">مرحباً الأدمن</h1>
            <div class="user-info">
                <button id="refreshUsersBtn" class="card-btn">🔄 تحديث</button>
                <button id="logoutBtn" class="card-btn danger">تسجيل الخروج</button>
            </div>
        </header>

        <div class="tabs">
            <button class="tab active" data-tab="users">👥 المستخدمون</button>
            <button class="tab" data-tab="plans">💎 الباقات</button>
            <button class="tab" data-tab="history">📋 السجلات</button>
        </div>

        <!-- تبويب المستخدمين -->
        <div id="panel-users" class="panel active">
            <div class="stats-grid">
                <div class="stat-card"><h3>إجمالي المستخدمين</h3><p id="statTotal">0</p></div>
                <div class="stat-card"><h3>الباقة المجانية</h3><p id="statFree">0</p></div>
                <div class="stat-card"><h3>الباقة الأسبوعية</h3><p id="statWeekly">0</p></div>
                <div class="stat-card"><h3>الباقة الشهرية</h3><p id="statMonthly">0</p></div>
            </div>
            <input type="text" id="userSearch" class="form-control search-box" placeholder="بحث بالاسم أو رقم الهاتف...">
            <div id="usersList" class="grid-list"></div>
        </div>

        <!-- 🆕 تبويب الباقات -->
        <div id="panel-plans" class="panel">
            <div id="plansList" class="plans-grid"></div>
        </div>

        <!-- تبويب السجلات -->
        <div id="panel-history" class="panel">
            <div class="sub-tabs">
                <button class="sub-tab active" data-htype="links">الروابط والتحميلات</button>
                <button class="sub-tab" data-htype="otp">رموز التحقق (OTP)</button>
                <button class="sub-tab" data-htype="login">تسجيل الدخول</button>
            </div>
            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <input type="text" id="historySearch" class="form-control" style="flex:1;" placeholder="بحث في السجل...">
                <button id="refreshHistoryBtn" class="card-btn">🔄 تحديث</button>
            </div>
            <div id="historyList" class="grid-list"></div>
        </div>
    </div>

    <!-- نافذة تعديل المستخدم -->
    <div id="userModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="userModalTitle">تعديل المستخدم</h3>
                <button class="close-btn" onclick="closeUserModal()">&times;</button>
            </div>
            <div id="userModalPhone" style="color:var(--text-muted); direction:ltr; text-align:right;"></div>
            <div id="userModalMeta" class="meta-row" style="flex-wrap:wrap; gap:10px;"></div>
            
            <div class="form-group">
                <label>الباقة</label>
                <select id="newPlanSelect" class="form-control"></select>
            </div>
            <div class="form-group">
                <label>التحميلات اليومية المستخدمة</label>
                <input type="number" id="downloadsInput" class="form-control">
            </div>
            <div class="form-group">
                <label>الاستماعات الشهرية المستخدمة</label>
                <input type="number" id="listensInput" class="form-control">
            </div>
            <div class="form-group">
                <label>تاريخ انتهاء الباقة (YYYY-MM-DD)</label>
                <input type="text" id="renewalDateInput" class="form-control" placeholder="مثال: 2026-12-31">
            </div>
            <div class="form-group">
                <label>حد الاستماع المخصص (-1 = بلا حدود، فارغ = الافتراضي)</label>
                <input type="number" id="customListenInput" class="form-control">
            </div>
            <div style="display:flex; gap:10px; margin-top:10px;">
                <button id="saveUserBtn" class="btn" style="flex:1;">حفظ التغييرات</button>
                <button id="deleteUserBtn" class="card-btn danger" style="padding:12px;">🗑️ حذف المستخدم</button>
            </div>
        </div>
    </div>

    <!-- نافذة عرض الفيديو/الصوت -->
    <div id="videoModal" class="modal">
        <div class="modal-content" style="max-width:700px;">
            <div class="modal-header">
                <h3 id="videoTitle">معاينة الملف</h3>
                <button class="close-btn" onclick="closeVideoModal()">&times;</button>
            </div>
            <div id="videoPlayerSlot" style="width:100%; background:black; border-radius:8px; overflow:hidden; display:flex; justify-content:center; align-items:center; min-height:250px;"></div>
            <div id="videoInfo" class="meta-row"></div>
        </div>
    </div>

    <script>
        const SERVER_URL = "https://link2go-proxy.vercel.app";
        const TOKEN_KEY = "link2go_admin_token";
        const USERNAME_KEY = "link2go_admin_username";

        localStorage.removeItem(TOKEN_KEY); 
        localStorage.removeItem(USERNAME_KEY);
        
        let adminToken = sessionStorage.getItem(TOKEN_KEY) || "";
        let adminUsername = sessionStorage.getItem(USERNAME_KEY) || "";
        let allUsers = [], allPlans = {}, currentEditingUser = null;
        let currentHistoryType = "links";
        let allHistory = { links: [], otp: [], login: [] };
        let refreshTimer = null;

        const $ = id => document.getElementById(id);
        const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
        const todayStr = () => new Date().toLocaleDateString("en-CA");

        // أسماء المنصات بالعربي مع أيقونات
        const PLATFORM_INFO = {
            tiktok: { name: 'تيك توك', icon: '🎵' },
            soundcloud: { name: 'ساوند كلاود', icon: '🎧' },
            facebook: { name: 'فيسبوك', icon: '📘' },
            instagram: { name: 'إنستجرام', icon: '📷' },
            youtube: { name: 'يوتيوب', icon: '▶️' },
            x: { name: 'تويتر (X)', icon: '𝕏' },
            shahid: { name: 'شاهد', icon: '🎬' },
            anghami: { name: 'أنغامي', icon: '🎼' }
        };

        function showMsg(text, type = "ok") {
            const m = $("msg");
            m.textContent = text;
            m.className = "msg show " + type;
            setTimeout(() => { m.className = "msg"; }, 4000);
        }

        function clearSession() {
            sessionStorage.removeItem(TOKEN_KEY);
            sessionStorage.removeItem(USERNAME_KEY);
            adminToken = ""; adminUsername = "";
        }
        function showLoginScreen() {
            $("loginScreen").classList.remove("hidden");
            $("mainPanel").classList.remove("show");
        }
        function forceLogout() { stopRefresh(); clearSession(); showLoginScreen(); }

        async function apiFetch(path, options = {}) {
            const r = await fetch(SERVER_URL + path, {
                ...options,
                headers: { "Content-Type": "application/json", "Authorization": "Bearer " + adminToken, ...(options.headers || {}) }
            });
            let d = {};
            try { d = await r.json(); } catch (_) {}
            if (r.status === 401) { forceLogout(); throw new Error(d.error || "انتهت الجلسة"); }
            if (r.status === 429) throw new Error(d.error || "طلبات كتير، استنى شوية");
            if (!r.ok || !d.success) throw new Error(d.error || `فشل الطلب (${r.status})`);
            return d;
        }

        $("loginBtn").addEventListener("click", doLogin);
        $("passwordInput").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
        $("usernameInput").addEventListener("keydown", e => { if (e.key === "Enter") $("passwordInput").focus(); });

        async function doLogin() {
            const username = $("usernameInput").value.trim();
            const password = $("passwordInput").value;
            const loginMsg = $("loginMsg");
            loginMsg.className = "login-msg";
            if (!username || !password) {
                loginMsg.textContent = "من فضلك اكتب البيانات";
                loginMsg.className = "login-msg show err";
                return;
            }
            const btn = $("loginBtn");
            btn.textContent = "جاري التحقق...";
            btn.disabled = true;
            try {
                const r = await fetch(SERVER_URL + "/admin-login", {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });
                let d = {};
                try { d = await r.json(); } catch (_) {}
                if (!r.ok || !d.success) throw new Error(d.error || "فشل تسجيل الدخول");

                adminToken = d.token; adminUsername = d.username;
                sessionStorage.setItem(TOKEN_KEY, adminToken);
                sessionStorage.setItem(USERNAME_KEY, adminUsername);
                $("passwordInput").value = "";
                $("loginScreen").classList.add("hidden");
                $("mainPanel").classList.add("show");
                $("welcomeText").textContent = "مرحباً " + adminUsername;
                startDashboard();
            } catch (e) {
                loginMsg.textContent = e.message;
                loginMsg.className = "login-msg show err";
            } finally {
                btn.textContent = "تسجيل الدخول";
                btn.disabled = false;
            }
        }

        $("logoutBtn").addEventListener("click", async () => {
            if (!confirm("هل أنت متأكد من تسجيل الخروج؟")) return;
            try { await fetch(SERVER_URL + "/admin-logout", { method: "POST", headers: { "Authorization": "Bearer " + adminToken } }); } catch (_) {}
            stopRefresh(); clearSession();
            location.reload();
        });

        async function checkAuth() {
            if (!adminToken) return false;
            try {
                const r = await fetch(SERVER_URL + "/admin-verify", { method: "POST", headers: { "Authorization": "Bearer " + adminToken } });
                if (!r.ok) { clearSession(); return false; }
                const d = await r.json();
                if (!d.success) { clearSession(); return false; }
                adminUsername = d.username || adminUsername;
                return true;
            } catch (_) { return false; }
        }

        document.querySelectorAll(".tab").forEach(tab => {
            tab.addEventListener("click", () => {
                document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
                document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
                tab.classList.add("active");
                $("panel-" + tab.dataset.tab).classList.add("active");
                if (tab.dataset.tab === "users") loadUsers();
                if (tab.dataset.tab === "plans") renderPlans();
                if (tab.dataset.tab === "history") loadHistory();
            });
        });

        document.querySelectorAll(".sub-tab").forEach(st => {
            st.addEventListener("click", () => {
                document.querySelectorAll(".sub-tab").forEach(x => x.classList.remove("active"));
                st.classList.add("active");
                currentHistoryType = st.dataset.htype;
                $("historySearch").value = "";
                renderHistory();
            });
        });

        const isExpired = u => u.plan_id !== "free" && u.renewal_date && u.renewal_date < todayStr();
        const effPlan = u => isExpired(u) ? "free" : u.plan_id;

        async function loadUsers() {
            try {
                const d = await apiFetch("/users-list");
                allUsers = d.users || [];
                renderUsers(filterUsers());
                updateStats();
            } catch (e) {
                $("usersList").innerHTML = `<div class="empty">❌ ${esc(e.message)}</div>`;
            }
        }

        function updateStats() {
            $("statTotal").textContent = allUsers.length;
            ["free", "weekly", "monthly"].forEach(p => {
                const id = "stat" + p[0].toUpperCase() + p.slice(1);
                $(id).textContent = allUsers.filter(u => effPlan(u) === p).length;
            });
        }

        function filterUsers() {
            const q = $("userSearch").value.trim().toLowerCase();
            if (!q) return allUsers;
            return allUsers.filter(u => (u.username || "").toLowerCase().includes(q) || (u.phone || "").includes(q));
        }

        function renderUsers(users) {
            const container = $("usersList");
            if (!users.length) { container.innerHTML = `<div class="empty">مفيش مستخدمين</div>`; return; }
            container.innerHTML = "";
            users.forEach(u => {
                const el = document.createElement("div");
                el.className = "card";
                const plan = effPlan(u);
                const lim = u.limit ?? u.plan_limit ?? 0;
                const lis = u.listens_limit ?? u.plan_listens_limit ?? 0;
                const cls = plan === "monthly" ? "monthly" : plan === "weekly" ? "weekly" : "free";
                el.innerHTML = `
                    <div class="card-head">
                        <div style="flex:1;min-width:0;">
                            <div class="card-title">${esc(u.username || "بدون اسم")}</div>
                            <div class="card-phone">📱 ${esc(u.phone)}</div>
                            <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;">
                                <span class="badge ${cls}">${esc(u.plan_name)}</span>
                                ${isExpired(u) ? `<span class="badge cancelled">منتهية</span>` : ""}
                                ${u.is_cancelled ? `<span class="badge cancelled">ملغي</span>` : ""}
                                ${u.upgrade_requested ? `<span class="badge pending">طلب ترقية</span>` : ""}
                            </div>
                        </div>
                        <div class="card-actions"><button class="card-btn primary" data-action="edit">تعديل</button></div>
                    </div>
                    <div class="meta-row">
                        <span>📥 ${u.daily_downloads} / ${lim === -1 ? "∞" : lim}</span>
                        <span>🎧 ${u.monthly_listens} / ${lis === -1 ? "∞" : lis}</span>
                        ${u.renewal_date ? `<span>📅 ${esc(u.renewal_date)}</span>` : ""}
                    </div>`;
                el.querySelector('[data-action="edit"]').addEventListener("click", () => openUserModal(u.phone));
                container.appendChild(el);
            });
        }

        $("userSearch").addEventListener("input", () => renderUsers(filterUsers()));
        $("refreshUsersBtn").addEventListener("click", loadUsers);

        // ==========================================
        // 🆕 الباقات
        // ==========================================
        const PLAN_DISPLAY = {
            guest: {
                order: 0,
                color: 'guest',
                title: 'زائر (غير مسجل)',
                price: 'مجاناً',
                priceLabel: '',
                features: [
                    { ok: true, text: '2 تحميلات يومياً' },
                    { ok: false, text: 'بدون استماع' },
                    { ok: false, text: 'بدون تسجيل دخول دائم' },
                    { ok: true, text: 'جودة عادية' }
                ]
            },
            free: {
                order: 1,
                color: 'free',
                title: 'الباقة المجانية',
                price: '0',
                priceLabel: 'جنيه / مجاناً',
                features: [
                    { ok: true, text: '10 تحميلات يومياً' },
                    { ok: true, text: '50 استماع شهرياً' },
                    { ok: true, text: 'حفظ الحساب والإحصائيات' },
                    { ok: false, text: 'بدون فيسبوك / انستجرام / يوتيوب' }
                ]
            },
            weekly: {
                order: 2,
                color: 'weekly',
                title: 'الباقة الأسبوعية',
                price: '10',
                priceLabel: 'جنيه / أسبوع',
                features: [
                    { ok: true, text: '20 تحميل يومياً' },
                    { ok: true, text: 'استماع غير محدود' },
                    { ok: true, text: 'فيسبوك + انستجرام' },
                    { ok: true, text: 'سرعة سيرفر عالية' }
                ]
            },
            monthly: {
                order: 3,
                color: 'monthly',
                title: 'الباقة الشهرية VIP',
                price: '50',
                priceLabel: 'جنيه / شهر',
                isPremium: true,
                features: [
                    { ok: true, text: 'تحميلات غير محدودة ♾️' },
                    { ok: true, text: 'استماع غير محدود ♾️' },
                    { ok: true, text: 'تحميل من أي موقع في العالم 🌍' },
                    { ok: true, text: 'أولوية قصوى في السرعة' }
                ]
            }
        };

        function renderPlans() {
            const container = $("plansList");
            const plans = allPlans || {};

            // لو مفيش باقات من السيرفر → نستخدم البيانات الثابتة
            const planKeys = Object.keys(plans).length
                ? Object.keys(plans).sort((a,b) => (PLAN_DISPLAY[a]?.order || 99) - (PLAN_DISPLAY[b]?.order || 99))
                : ['guest', 'free', 'weekly', 'monthly'];

            if (!planKeys.length) {
                container.innerHTML = `<div class="empty">مفيش باقات متاحة</div>`;
                return;
            }

            container.innerHTML = '';
            planKeys.forEach(pid => {
                const fromServer = plans[pid] || {};
                const display = PLAN_DISPLAY[pid] || {};
                const plan = { ...display, ...fromServer };
                const colorClass = plan.color || 'free';
                const isUnlimited = plan.all_platforms || (fromServer.platforms && fromServer.platforms.length >= 8);

                const platforms = (fromServer.platforms || []).map(p => {
                    const info = PLATFORM_INFO[p] || { name: p, icon: '🔗' };
                    return `<span class="platform-chip">${info.icon} ${info.name}</span>`;
                }).join('');

                const platformsHTML = isUnlimited
                    ? `<div class="plan-platforms-title">🌍 كل المواقع مدعومة</div>
                       <div class="plan-platforms">
                           ${platforms}
                           <span class="platform-chip unlimited">✨ وأي موقع تاني</span>
                       </div>`
                    : `<div class="plan-platforms-title">📱 المواقع المدعومة</div>
                       <div class="plan-platforms">${platforms || '<span style="color:var(--text-muted);font-size:11px;">—</span>'}</div>`;

                const featuresHTML = (plan.features || []).map(f =>
                    `<li class="${f.ok ? 'ok' : 'no'}">${esc(f.text)}</li>`
                ).join('');

                const priceDisplay = fromServer.price !== undefined
                    ? `${fromServer.price}`
                    : plan.price;
                const priceLabel = fromServer.duration_label || plan.priceLabel || '';

                const card = document.createElement('div');
                card.className = `plan-card ${colorClass}`;
                card.innerHTML = `
                    ${plan.isPremium ? '<div class="plan-badge-premium">🔥 الأكثر طلباً</div>' : ''}
                    <div class="plan-head">
                        <div>
                            <div class="plan-name">${esc(fromServer.name || plan.title)}</div>
                            <div style="font-size:11px;color:var(--text-muted);font-weight:600;">ID: ${esc(pid)}</div>
                        </div>
                        <div class="plan-price">
                            ${esc(priceDisplay)}
                            <small>${esc(priceLabel)}</small>
                        </div>
                    </div>

                    <ul class="plan-features">${featuresHTML}</ul>

                    <div>${platformsHTML}</div>

                    <div class="plan-footer">
                        ${fromServer.limit === -1 ? 'تحميلات: ♾️ غير محدود' : `حد التحميل اليومي: ${fromServer.limit || plan.features?.[0]?.text || '—'}`}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function loadPlans() {
            try {
                const r = await fetch(SERVER_URL + "/get-plans");
                const d = await r.json();
                if (r.ok && d.success) {
                    allPlans = d.plans || {};
                    // لو احنا على تاب الباقات → نحدث العرض
                    if (document.querySelector('.tab[data-tab="plans"].active')) {
                        renderPlans();
                    }
                }
            } catch (e) { console.error(e); }
        }

        // ==========================================
        // السجلات
        // ==========================================
        async function loadHistory() {
            $("historyList").innerHTML = `<div class="loading">جاري التحميل...</div>`;
            try {
                const d = await apiFetch("/history?type=all&limit=500");
                allHistory = Object.assign({ links: [], otp: [], login: [] }, d.data || {});
                renderHistory();
            } catch (e) {
                $("historyList").innerHTML = `<div class="empty">❌ ${esc(e.message)}</div>`;
            }
        }

        const LOGIN_ACTIONS = { admin_login: "🔑 دخول أدمن", otp_login: "📱 دخول مستخدم", signup: "🆕 تسجيل جديد", logout: "🚪 خروج" };
        const ADMIN_ACTIONS = {
            set_plan: "تغيير باقة", delete_user: "حذف مستخدم", set_counters: "تعديل عدادات",
            set_listen_limit: "تعديل حد الاستماع", clear_history: "مسح السجل", delete_file: "حذف ملف"
        };

        function renderHistory(list = allHistory[currentHistoryType] || []) {
            const container = $("historyList");
            if (!list.length) { container.innerHTML = `<div class="empty">مفيش سجل</div>`; return; }
            container.innerHTML = "";
            const t = currentHistoryType;

            list.forEach(item => {
                const ok = item.status === "success";
                const st = ok ? ["success", "نجح"] : item.status === "quota" ? ["quota", "حد أقصى"] : ["failed", "فشل"];
                let title = "", phone = "", badges = "", lines = "";

                if (t === "links") {
                    title = esc(item.username || "مجهول");
                    phone = item.phone || "—";
                    badges = `<span class="badge ${item.action === "stream" ? "stream" : "download"}">${item.action === "stream" ? "🎧 استماع" : "⬇️ تحميل"}</span>`;
                    lines += `<span style="word-break:break-all;direction:ltr;text-align:right;color:#9fc4ff;font-size:10.5px;">${esc((item.url || "").slice(0, 80))}</span>`;
                    if (item.error === "cache") badges += `<span class="badge success">⚡ من الكاش</span>`;
                    else if (item.error) lines += `<span style="color:#ff9ca5;">⚠️ ${esc(item.error)}</span>`;
                } else if (t === "otp") {
                    title = "📱 " + esc(item.phone || "—");
                    badges = `<span class="badge video">${item.action === "send" ? "📤 إرسال" : "✅ تحقق"}</span>`;
                    if (item.error) lines += `<span style="color:#ff9ca5;">⚠️ ${esc(item.error)}</span>`;
                } else {
                    const raw = String(item.action || "");
                    const base = raw.split(":")[0];
                    const isAdminAction = raw.includes(":") && ADMIN_ACTIONS[base];
                    title = esc(item.username || "—");
                    phone = item.phone || "—";
                    badges = `<span class="badge free">${isAdminAction ? "🛠️ " + ADMIN_ACTIONS[base] : (LOGIN_ACTIONS[raw] || esc(raw))}</span>`;
                    if (isAdminAction) lines += `<span style="direction:ltr;text-align:right;color:#9fc4ff;font-size:10.5px;">${esc(raw.slice(base.length + 1))}</span>`;
                    if (item.error) lines += `<span style="color:#ff9ca5;">⚠️ ${esc(item.error)}</span>`;
                }

                const el = document.createElement("div");
                el.className = "card";
                el.innerHTML = `
                    <div class="card-head"><div style="flex:1;min-width:0;">
                        <div class="card-title">${title}</div>
                        ${phone ? `<div class="card-phone">📱 ${esc(phone)}</div>` : ""}
                        <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;">${badges}<span class="badge ${st[0]}">${st[1]}</span></div>
                    </div></div>
                    <div class="meta-row" style="flex-direction:column;gap:4px;">
                        ${lines}
                        <span>🕐 ${esc(item.timestamp || "—")}${item.ip ? " · 🌐 " + esc(item.ip) : ""}</span>
                    </div>`;
                container.appendChild(el);
            });
        }

        $("refreshHistoryBtn").addEventListener("click", loadHistory);
        $("historySearch").addEventListener("input", e => {
            const q = e.target.value.trim().toLowerCase();
            const list = allHistory[currentHistoryType] || [];
            renderHistory(q ? list.filter(i => JSON.stringify(i).toLowerCase().includes(q)) : list);
        });

        (function addClearBtn() {
            const b = document.createElement("button");
            b.className = "sub-tab";
            b.style.cssText = "margin-inline-start:auto;color:#ff9ca5;";
            b.textContent = "🗑️ مسح";
            b.addEventListener("click", async () => {
                if (!confirm("مسح سجل هذا القسم نهائياً؟")) return;
                try {
                    await apiFetch("/history/clear", { method: "POST", body: JSON.stringify({ type: currentHistoryType }) });
                    showMsg("✅ تم مسح السجل");
                    loadHistory();
                } catch (e) { showMsg("❌ " + e.message, "err"); }
            });
            document.querySelector(".sub-tabs").appendChild(b);
        })();

        async function openUserModal(phone) {
            $("userModal").classList.add("active");
            $("userModalTitle").textContent = "جاري التحميل...";
            $("userModalPhone").textContent = "";
            $("userModalMeta").innerHTML = "";
            try {
                const d = await apiFetch("/user/" + encodeURIComponent(phone));
                currentEditingUser = d.user;
                if (!Object.keys(allPlans).length) await loadPlans();
                renderUserModal(d.user);
            } catch (e) {
                $("userModalTitle").textContent = "خطأ";
                $("userModalPhone").textContent = e.message;
            }
        }

        function renderUserModal(u) {
            $("userModalTitle").textContent = u.username || "مستخدم";
            $("userModalPhone").textContent = "📱 " + u.phone;
            const meta = [];
            if (u.created_at) meta.push(`🗓️ ${esc(u.created_at)}`);
            if (u.last_login) meta.push(`🔐 ${esc(u.last_login)}`);
            $("userModalMeta").innerHTML = meta.map(p => `<span>${p}</span>`).join("");
            $("newPlanSelect").innerHTML = Object.keys(allPlans).map(pid =>
                `<option value="${esc(pid)}" ${pid === u.plan_id ? "selected" : ""}>${esc(allPlans[pid].name)}</option>`).join("");
            $("downloadsInput").value = u.daily_downloads || 0;
            $("listensInput").value = u.monthly_listens || 0;
            $("renewalDateInput").value = u.renewal_date || "";
            $("customListenInput").value = "";
        }

        $("saveUserBtn").addEventListener("click", async () => {
            if (!currentEditingUser) return;
            const btn = $("saveUserBtn");
            btn.textContent = "جاري الحفظ...";
            btn.disabled = true;
            try {
                const phone = encodeURIComponent(currentEditingUser.phone);
                const newPlan = $("newPlanSelect").value;
                const planChanged = newPlan !== currentEditingUser.plan_id;
                if (planChanged) {
                    await apiFetch(`/user/${phone}/set-plan`, { method: "POST", body: JSON.stringify({ plan: newPlan }) });
                }

                const body = {
                    daily_downloads: parseInt($("downloadsInput").value) || 0,
                    monthly_listens: parseInt($("listensInput").value) || 0
                };
                const dateVal = $("renewalDateInput").value || "";
                const dateEdited = dateVal !== (currentEditingUser.renewal_date || "");
                if (!planChanged || dateEdited) body.renewal_date = dateVal;

                const custom = parseInt($("customListenInput").value);
                if (!Number.isNaN(custom)) body.listens_limit = custom;

                await apiFetch(`/user/${phone}/set-counters`, { method: "POST", body: JSON.stringify(body) });
                showMsg("✅ تم حفظ التغييرات");
                closeUserModal();
                loadUsers();
            } catch (e) {
                showMsg("❌ " + e.message, "err");
            } finally {
                btn.textContent = "حفظ التغييرات";
                btn.disabled = false;
            }
        });

        $("deleteUserBtn").addEventListener("click", async () => {
            if (!currentEditingUser) return;
            const u = currentEditingUser;
            if (!confirm(`هل أنت متأكد من حذف المستخدم "${u.username || u.phone}"؟`)) return;
            const btn = $("deleteUserBtn");
            btn.textContent = "جاري الحذف...";
            btn.disabled = true;
            try {
                await apiFetch(`/user/${encodeURIComponent(u.phone)}`, { method: "DELETE" });
                showMsg("✅ تم حذف المستخدم");
                closeUserModal();
                loadUsers();
            } catch (e) {
                showMsg("❌ " + e.message, "err");
            } finally {
                btn.textContent = "🗑️ حذف المستخدم";
                btn.disabled = false;
            }
        });

        function closeUserModal() {
            $("userModal").classList.remove("active");
            currentEditingUser = null;
        }
        $("userModal").addEventListener("click", e => { if (e.target.id === "userModal") closeUserModal(); });

        function startRefresh() {
            stopRefresh();
            refreshTimer = setInterval(() => {
                if (document.hidden || !adminToken) return;
                if (document.querySelector('.tab[data-tab="users"].active')) loadUsers();
            }, 30000);
        }
        function stopRefresh() { if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; } }

        function startDashboard() {
            loadPlans().then(() => {
                // بعد ما نجيب الباقات → نحدث عرضها
                if (document.querySelector('.tab[data-tab="plans"].active')) renderPlans();
            });
            loadUsers();
            startRefresh();
        }

        (async function init() {
            if (await checkAuth()) {
                $("loginScreen").classList.add("hidden");
                $("mainPanel").classList.add("show");
                $("welcomeText").textContent = "مرحباً " + adminUsername;
                startDashboard();
            } else {
                showLoginScreen();
            }
        })();
    </script>
</body>
</html>
