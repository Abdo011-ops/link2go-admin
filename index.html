
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Link2Go — لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #08070d;
  --bg-2: #0d0c15;
  --surface: rgba(22,20,35,.72);
  --surface-2: rgba(30,27,48,.85);
  --border: rgba(168,132,255,.14);
  --border-2: rgba(168,132,255,.28);
  --text: #f5f3ff;
  --muted: #a09db8;
  --muted-2: #6b6885;
  --accent: #a855f7;
  --accent-2: #7c3aed;
  --accent-3: #c084fc;
  --success: #10b981;
  --danger: #ef4444;
  --warning: #f59e0b;
  --info: #3b82f6;
  --glow: 0 0 40px rgba(168,85,247,.3);
}

body {
  font-family: 'Cairo', system-ui, sans-serif;
  background:
    radial-gradient(
      ellipse 80% 50% at 50% -10%,
      rgba(168,85,247,.18),
      transparent
    ),
    radial-gradient(
      ellipse 60% 40% at 80% 100%,
      rgba(124,58,237,.12),
      transparent
    ),
    linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
  background-attachment: fixed;
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* إشعارات النظام */
.toast {
  position: fixed;
  top: 24px;
  left: 50%;
  transform: translate(-50%, -120%);
  padding: 13px 24px;
  border-radius: 13px;
  background: rgba(22,20,35,.97);
  border: 1px solid var(--border-2);
  backdrop-filter: blur(20px);
  font-size: 13px;
  font-weight: 700;
  z-index: 9999;
  transition: transform .4s cubic-bezier(.16,1,.3,1);
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
  max-width: 90vw;
  display: flex;
  align-items: center;
  gap: 10px;
  pointer-events: none;
}

.toast.show {
  transform: translate(-50%, 0);
}

.toast.ok {
  border-color: rgba(16,185,129,.4);
  color: #6ee7b7;
}

.toast.err {
  border-color: rgba(239,68,68,.4);
  color: #fca5a5;
}

@media (max-width: 600px) {
  .toast {
    top: auto;
    bottom: 20px;
    transform: translate(-50%, 140%);
  }

  .toast.show {
    transform: translate(-50%, 0);
  }
}

/* شاشة تسجيل الدخول */
#loginScreen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  position: relative;
  z-index: 1;
}

#loginScreen.hidden {
  display: none;
}

.login-card {
  width: 100%;
  max-width: 400px;
  background: linear-gradient(
    145deg,
    rgba(30,27,48,.9),
    rgba(20,18,32,.95)
  );
  border: 1px solid var(--border-2);
  border-radius: 24px;
  padding: 42px 32px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 30px 90px rgba(0,0,0,.7), var(--glow);
  animation: cardIn .6s cubic-bezier(.16,1,.3,1);
}

@keyframes cardIn {
  from {
    opacity: 0;
    transform: translateY(20px) scale(.97);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.login-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(
    90deg,
    transparent,
    var(--accent),
    var(--accent-3),
    transparent
  );
  background-size: 200% 100%;
  animation: shine 3s linear infinite;
}

@keyframes shine {
  to {
    background-position: 200% center;
  }
}

.login-logo {
  width: 72px;
  height: 72px;
  border-radius: 20px;
  margin: 0 auto 20px;
  display: grid;
  place-items: center;
  background: linear-gradient(
    135deg,
    var(--accent),
    var(--accent-2)
  );
  box-shadow: 0 15px 40px rgba(168,85,247,.5);
  font-size: 32px;
}

.login-card h2 {
  font-size: 24px;
  font-weight: 800;
  text-align: center;
  margin-bottom: 6px;
  background: linear-gradient(135deg, #fff, var(--accent-3));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.login-card p {
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  margin-bottom: 28px;
}

.input-group {
  margin-bottom: 16px;
  text-align: right;
}

.input-group label {
  display: block;
  font-size: 12px;
  color: var(--muted);
  font-weight: 600;
  margin-bottom: 6px;
}

.input-group input {
  width: 100%;
  padding: 14px 16px;
  border-radius: 12px;
  background: rgba(10,9,16,.6);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: inherit;
  font-size: 14px;
  outline: none;
  transition: .25s;
}

.input-group input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px rgba(168,85,247,.12);
}

.btn-primary {
  width: 100%;
  padding: 14px;
  border-radius: 13px;
  border: 0;
  background: linear-gradient(
    135deg,
    var(--accent),
    var(--accent-2)
  );
  color: #fff;
  font-family: inherit;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  transition: .25s;
  box-shadow: 0 12px 35px rgba(168,85,247,.35);
  margin-top: 8px;
}

.btn-primary:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 17px 45px rgba(168,85,247,.5);
}

.btn-primary:disabled {
  opacity: .6;
  cursor: wait;
}

.login-msg {
  display: none;
  margin-top: 14px;
  padding: 11px 14px;
  border-radius: 11px;
  font-size: 12.5px;
  text-align: center;
  font-weight: 600;
}

.login-msg.show {
  display: block;
}

.login-msg.err {
  background: rgba(239,68,68,.1);
  color: #fca5a5;
  border: 1px solid rgba(239,68,68,.25);
}

/* اللوحة الرئيسية */
#mainPanel {
  display: none;
  position: relative;
  z-index: 1;
}

#mainPanel.show {
  display: block;
}

.wrap {
  width: min(1240px, 94%);
  margin: 0 auto;
  padding: 28px 0 80px;
}

.app-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 0 24px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 28px;
  flex-wrap: wrap;
  gap: 14px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
  color: inherit;
}

.brand-icon {
  width: 44px;
  height: 44px;
  border-radius: 13px;
  background: linear-gradient(
    135deg,
    var(--accent),
    var(--accent-2)
  );
  display: grid;
  place-items: center;
  box-shadow: 0 10px 30px rgba(168,85,247,.4);
  font-size: 22px;
}

.brand-text strong {
  display: block;
  font-size: 17px;
  font-weight: 900;
}

.brand-text span {
  display: block;
  color: var(--muted);
  font-size: 11.5px;
  margin-top: 2px;
}

.brand-text .last-update {
  font-size: 10.5px;
  color: var(--muted-2);
  margin-top: 2px;
}

.header-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}

.icon-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  border-radius: 11px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 700;
  cursor: pointer;
  transition: .25s;
  text-decoration: none;
}

.icon-btn:hover:not(:disabled) {
  background: var(--surface-2);
  border-color: var(--border-2);
  transform: translateY(-1px);
}

.icon-btn:disabled {
  opacity: .5;
  cursor: wait;
}

.icon-btn.danger:hover {
  border-color: rgba(239,68,68,.5);
  color: #fca5a5;
}

.icon-btn svg {
  width: 15px;
  height: 15px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2.4;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* تبويبات لوحة التحكم */
.tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 24px;
  background: var(--surface);
  padding: 6px;
  border-radius: 16px;
  border: 1px solid var(--border);
  width: fit-content;
  max-width: 100%;
  overflow-x: auto;
}

.tabs::-webkit-scrollbar {
  display: none;
}

.tab {
  padding: 11px 20px;
  border-radius: 11px;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-family: inherit;
  font-size: 13.5px;
  font-weight: 700;
  cursor: pointer;
  transition: .25s;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
}

.tab:hover {
  color: var(--text);
}

.tab.active {
  background: linear-gradient(
    135deg,
    var(--accent),
    var(--accent-2)
  );
  color: #fff;
  box-shadow: 0 10px 30px rgba(168,85,247,.4);
}

.tab svg {
  width: 15px;
  height: 15px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2.4;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.tab .badge-mini {
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 100px;
  background: rgba(255,255,255,.15);
  font-weight: 800;
}

.tab.active .badge-mini {
  background: rgba(255,255,255,.3);
}

.panel {
  display: none;
}

.panel.active {
  display: block;
  animation: panelIn .4s cubic-bezier(.16,1,.3,1);
}

@keyframes panelIn {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* بطاقات الإحصائيات */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 14px;
  margin-bottom: 24px;
}

.stat {
  background: linear-gradient(
    145deg,
    rgba(30,27,48,.7),
    rgba(20,18,32,.85)
  );
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  position: relative;
  overflow: hidden;
  transition: .3s;
}

.stat:hover {
  border-color: var(--border-2);
  transform: translateY(-3px);
  box-shadow: 0 20px 50px rgba(0,0,0,.4);
}

.stat::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(
    90deg,
    var(--accent),
    var(--accent-3)
  );
  opacity: .6;
}

.stat.blue::before {
  background: linear-gradient(90deg, #3b82f6, #60a5fa);
}

.stat.green::before {
  background: linear-gradient(90deg, #10b981, #34d399);
}

.stat.gold::before {
  background: linear-gradient(90deg, #f59e0b, #fbbf24);
}

.stat.red::before {
  background: linear-gradient(90deg, #ef4444, #f87171);
}

.stat-icon {
  width: 38px;
  height: 38px;
  border-radius: 11px;
  background: rgba(168,85,247,.15);
  display: grid;
  place-items: center;
  margin-bottom: 12px;
  font-size: 18px;
}

.stat.blue .stat-icon {
  background: rgba(59,130,246,.15);
}

.stat.green .stat-icon {
  background: rgba(16,185,129,.15);
}

.stat.gold .stat-icon {
  background: rgba(245,158,11,.15);
}

.stat.red .stat-icon {
  background: rgba(239,68,68,.15);
}

.stat-label {
  font-size: 12px;
  color: var(--muted);
  font-weight: 600;
  margin-bottom: 6px;
}

.stat-value {
  font-size: 26px;
  font-weight: 900;
  letter-spacing: -.5px;
  line-height: 1;
}

.stat.blue .stat-value { color: #60a5fa; }
.stat.green .stat-value { color: #34d399; }
.stat.gold .stat-value { color: #fbbf24; }
.stat.red .stat-value { color: #f87171; }

/* البحث */
.search-bar {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.search-bar input {
  flex: 1;
  min-width: 220px;
  padding: 13px 18px;
  border-radius: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: inherit;
  font-size: 13.5px;
  outline: none;
  transition: .25s;
}

.search-bar input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px rgba(168,85,247,.12);
}

.search-bar button {
  padding: 13px 22px;
  border-radius: 12px;
  border: 0;
  background: linear-gradient(
    135deg,
    var(--accent),
    var(--accent-2)
  );
  color: #fff;
  font-family: inherit;
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
  transition: .25s;
  box-shadow: 0 10px 30px rgba(168,85,247,.3);
}

.search-bar button:hover:not(:disabled) {
  transform: translateY(-2px);
}

.search-bar button:disabled {
  opacity: .6;
  cursor: wait;
}

/* بطاقات البيانات */
.list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 14px;
}

.card {
  background: linear-gradient(
    145deg,
    rgba(30,27,48,.65),
    rgba(20,18,32,.85)
  );
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px;
  transition: .3s;
  position: relative;
  overflow: hidden;
}

.card:hover {
  border-color: var(--border-2);
  transform: translateY(-3px);
  box-shadow: 0 25px 60px rgba(0,0,0,.5);
}

.card-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}

.card-title {
  font-size: 15px;
  font-weight: 800;
  margin-bottom: 4px;
  word-break: break-word;
}

.card-phone {
  font-size: 12.5px;
  color: var(--accent-3);
  direction: ltr;
  text-align: right;
  font-weight: 600;
}

.badges {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  margin-top: 8px;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border-radius: 100px;
  font-size: 10.5px;
  font-weight: 800;
}

.badge.free { background: rgba(148,163,184,.15); color: #cbd5e1; }
.badge.weekly { background: rgba(59,130,246,.2); color: #93c5fd; }
.badge.monthly { background: linear-gradient(135deg,#f59e0b,#fbbf24); color: #000; }
.badge.success { background: rgba(16,185,129,.18); color: #6ee7b7; }
.badge.failed { background: rgba(239,68,68,.18); color: #fca5a5; }
.badge.quota { background: rgba(245,158,11,.18); color: #fcd34d; }
.badge.cancelled { background: rgba(239,68,68,.15); color: #fca5a5; }
.badge.pending { background: rgba(245,158,11,.15); color: #fcd34d; }
.badge.stream { background: rgba(168,85,247,.2); color: #d8b4fe; }
.badge.download { background: rgba(59,130,246,.2); color: #93c5fd; }
.badge.video { background: rgba(59,130,246,.15); color: #93c5fd; }
.badge.cache { background: rgba(16,185,129,.2); color: #6ee7b7; }
.badge.low { background: rgba(59,130,246,.2); color: #93c5fd; }
.badge.medium { background: rgba(245,158,11,.2); color: #fcd34d; }
.badge.high { background: rgba(239,68,68,.25); color: #fca5a5; }
.badge.critical {
  background: rgba(239,68,68,.4);
  color: #fff;
  animation: pulse-red 1.5s infinite;
}
.badge.rate { background: rgba(245,158,11,.25); color: #fcd34d; }
.badge.ip {
  background: rgba(168,85,247,.2);
  color: #d8b4fe;
  direction: ltr;
}

@keyframes pulse-red {
  0%, 100% {
    box-shadow: 0 0 0 0 rgba(239,68,68,.5);
  }
  50% {
    box-shadow: 0 0 0 6px rgba(239,68,68,0);
  }
}

.meta-row {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  margin-top: 10px;
  padding-top: 12px;
  border-top: 1px dashed rgba(168,132,255,.12);
  font-size: 11.5px;
  color: var(--muted);
  font-weight: 600;
}

.meta-row span {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.card-actions {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 10px;
}

.card-btn {
  padding: 8px 14px;
  border-radius: 9px;
  background: rgba(168,85,247,.1);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: inherit;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: .2s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  text-decoration: none;
}

.card-btn:hover:not(:disabled) {
  background: var(--surface-2);
  border-color: var(--border-2);
}

.card-btn:disabled {
  opacity: .5;
  cursor: wait;
}

.card-btn.primary {
  background: linear-gradient(
    135deg,
    var(--accent),
    var(--accent-2)
  );
  border-color: transparent;
  color: #fff;
  box-shadow: 0 8px 25px rgba(168,85,247,.35);
}

.card-btn.primary:hover:not(:disabled) {
  box-shadow: 0 12px 35px rgba(168,85,247,.5);
}

.card-btn.danger {
  background: rgba(239,68,68,.1);
  border-color: rgba(239,68,68,.3);
  color: #fca5a5;
}

.card-btn.danger:hover:not(:disabled) {
  background: rgba(239,68,68,.25);
  color: #fff;
}

.card-btn.success {
  background: rgba(16,185,129,.1);
  border-color: rgba(16,185,129,.3);
  color: #6ee7b7;
}

.card-btn.success:hover:not(:disabled) {
  background: rgba(16,185,129,.25);
  color: #fff;
}

.card-btn svg {
  width: 13px;
  height: 13px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2.4;
}

.empty,
.loading {
  grid-column: 1 / -1;
  padding: 60px 20px;
  text-align: center;
  color: var(--muted);
  font-size: 13.5px;
  font-weight: 600;
}

.loading::before {
  content: '';
  display: block;
  width: 36px;
  height: 36px;
  margin: 0 auto 16px;
  border: 3px solid rgba(168,85,247,.2);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
</head>
<body>
